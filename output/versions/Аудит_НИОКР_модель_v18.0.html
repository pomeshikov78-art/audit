<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Аудит НИОКР — интерактивная модель оценки, v18.0</title>
<style>
:root{
  --navy:#1f3864; --navy2:#2e5395; --accent:#2e74b5; --sky:#9db7e0;
  --bg:#f4f6fa; --card:#ffffff; --ink:#262626; --gray:#595959; --lgray:#8c8c8c;
  --red:#c62828; --orange:#ef6c00; --yellow:#fbc02d; --green:#2e7d32; --lgreen:#7cb342; --np:#9e9e9e;
  --input:#fff2cc; --shadow:0 2px 10px rgba(31,56,100,.10);
}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 "Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink)}
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;background:var(--navy);color:#fff;padding:10px 18px;flex-wrap:wrap}
.topbar .logo{width:34px;height:34px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
.topbar h1{font-size:16px;margin:0;font-weight:600}
.topbar .ver{background:var(--accent);border-radius:10px;padding:2px 9px;font-size:11px;font-weight:700}
.topbar .spacer{flex:1}
.btn{border:0;border-radius:8px;padding:8px 14px;font:600 12.5px "Segoe UI",sans-serif;cursor:pointer;background:var(--accent);color:#fff;transition:.15s}
.btn:hover{filter:brightness(1.12)}
.btn.ghost{background:transparent;color:#fff;border:1px solid var(--sky)}
.btn.warn{background:var(--orange)}
.btn.gray{background:#e8ebf2;color:var(--navy)}
.btn.sm{padding:5px 10px;font-size:11.5px}
select,input[type=text],input[type=number],textarea{font:13px "Segoe UI",sans-serif;border:1px solid #c6cede;border-radius:7px;padding:6px 8px;background:#fff;color:var(--ink)}
select:focus,textarea:focus,input:focus{outline:2px solid var(--sky)}
.tabs{display:flex;gap:4px;background:#e6ebf4;padding:8px 14px 0;flex-wrap:wrap;position:sticky;top:54px;z-index:30}
.tabs button{border:0;border-radius:9px 9px 0 0;padding:9px 16px;font:600 13px "Segoe UI",sans-serif;cursor:pointer;background:transparent;color:var(--gray)}
.tabs button.on{background:var(--bg);color:var(--navy);box-shadow:0 -2px 6px rgba(31,56,100,.08)}
main{padding:16px 18px 60px;max-width:1420px;margin:0 auto}
section.tab{display:none}
section.tab.on{display:block}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.card{background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:14px 16px}
.card h3{margin:0 0 10px;font-size:13px;color:var(--navy);text-transform:uppercase;letter-spacing:.4px}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi .v{font-size:30px;font-weight:800;color:var(--navy)}
.kpi .l{font-size:11.5px;color:var(--gray)}
.pill{display:inline-block;border-radius:10px;padding:2px 10px;font-size:11.5px;font-weight:700;color:#fff}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{background:var(--navy);color:#fff;padding:7px 8px;text-align:left;font-size:11.5px}
td{border:1px solid #e2e7f0;padding:6px 8px;vertical-align:top}
tr:nth-child(even) td{background:#f6f8fc}
.qrow{border:1px solid #e2e7f0;border-radius:10px;background:#fff;margin-bottom:10px;overflow:hidden}
.qrow .qh{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;background:#f6f8fc}
.qrow .num{min-width:26px;height:26px;border-radius:7px;background:var(--navy2);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}
.qrow .qt{flex:1}
.qrow .qt b{font-size:13px}
.qrow .qt .est{display:block;color:var(--gray);font-size:11.5px;margin-top:3px}
.qrow .qb{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:9px 12px}
.score-chip{min-width:38px;text-align:center;border-radius:8px;padding:5px 8px;font-weight:800;color:#fff;background:var(--np)}
.blk-h{display:flex;align-items:center;gap:10px;background:var(--navy);color:#fff;border-radius:10px;padding:9px 14px;margin:16px 0 10px;font-weight:700}
.blk-h .w{margin-left:auto;background:var(--accent);border-radius:9px;padding:2px 10px;font-size:12px}
.blk-sum{display:flex;gap:18px;flex-wrap:wrap;background:#eef3fa;border-radius:10px;padding:9px 14px;font-size:12.5px;margin-bottom:6px}
.blk-sum b{color:var(--navy)}
.heat{display:flex;gap:3px;flex-wrap:wrap}
.heat div{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:10.5px;font-weight:700;cursor:pointer}
#toasts{position:fixed;top:64px;right:16px;z-index:90;display:flex;flex-direction:column;gap:8px;max-width:360px}
.toast{border-radius:10px;padding:10px 14px;color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.25);font-size:12.5px;animation:tin .25s;display:flex;gap:9px;align-items:flex-start}
.toast .ic{font-size:15px}
.toast.ok{background:var(--green)}.toast.warn{background:var(--orange)}.toast.err{background:var(--red)}.toast.info{background:var(--navy2)}
@keyframes tin{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
#moverlay{position:fixed;inset:0;background:rgba(20,30,55,.55);z-index:80;display:none;align-items:center;justify-content:center;padding:20px}
#moverlay.on{display:flex}
.modal{background:#fff;border-radius:14px;max-width:640px;width:100%;max-height:86vh;overflow:auto;padding:20px 22px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal h2{margin:0 0 10px;font-size:17px;color:var(--navy)}
.modal .mbtns{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.feed{max-height:230px;overflow:auto}
.feed .fi{border-left:4px solid var(--accent);background:#f4f7fc;border-radius:0 8px 8px 0;padding:6px 10px;margin-bottom:6px;font-size:12px}
.feed .fi.warn{border-color:var(--orange)}.feed .fi.err{border-color:var(--red)}.feed .fi.ok{border-color:var(--green)}
.field{display:grid;grid-template-columns:230px 1fr;gap:8px;align-items:center;margin-bottom:7px}
.field label{font-size:12.5px;color:var(--gray);font-weight:600}
.note{background:#fbf6e9;border-left:4px solid var(--yellow);border-radius:0 8px 8px 0;padding:9px 12px;font-size:12.5px;margin:10px 0}
.formula{background:#10233f;color:#cfe3ff;border-radius:9px;padding:10px 14px;font:12.5px/1.6 Consolas,monospace;overflow:auto}
.src a{color:var(--accent)}
.mini{font-size:11px;color:var(--lgray)}
.bar{height:14px;border-radius:7px;background:#e6ebf4;overflow:hidden}
.bar i{display:block;height:100%;border-radius:7px}
/* ---------- тёмная тема (этап 4) ---------- */
body.dark{--bg:#131a27;--card:#1c2536;--ink:#e8ecf5;--gray:#a9b4c8;--lgray:#7d8aa3;--input:#26334a;--shadow:0 2px 12px rgba(0,0,0,.45)}
body.dark .topbar{background:#0e1522}
body.dark .tabs{background:#0e1522}
body.dark .tabs button{color:#8fa1bf}
body.dark .tabs button.on{background:#131a27;color:#cfe3ff}
body.dark select,body.dark input[type=text],body.dark input[type=number],body.dark textarea{background:#243044;color:#e8ecf5;border-color:#3b4c6b}
body.dark input[readonly]{background:#1a2334!important}
body.dark th{background:#16233c}
body.dark td{border-color:#2c3a52}
body.dark tr:nth-child(even) td{background:#202c42}
body.dark .qrow{background:#1c2536;border-color:#2c3a52}
body.dark .qrow .qh{background:#202c42}
body.dark .qrow .qt .est{color:#a9b4c8}
body.dark .blk-h{background:#16233c}
body.dark .blk-sum{background:#202c42}
body.dark .blk-sum b{color:#9db7e0}
body.dark .card h3{color:#9db7e0}
body.dark .note{background:#2b2612;border-color:#fbc02d}
body.dark .formula{background:#0b1526;border:1px solid #22304a}
body.dark .feed .fi{background:#202c42}
body.dark .modal{background:#1c2536;color:#e8ecf5}
body.dark .field label{color:#a9b4c8}
body.dark .bar{background:#202c42}
body.dark .btn.gray{background:#243044;color:#cfe3ff}
body.dark .heat div[style*="dfe6f2"]{background:#243044!important}
body.dark .kpi .v{color:#cfe3ff}
body.dark .mini{color:#7d8aa3}
/* ======== ПРЕЗЕНТАЦИЯ (этап 7) ======== */
.slide{background:#fff;border:1px solid #d5dcea;border-radius:12px;max-width:980px;margin:0 auto;padding:26px 32px;min-height:430px;position:relative;box-shadow:0 4px 14px rgba(15,30,60,.10)}
.slide,.slide *{color:#20242c}
.slide h1,.slide h2{color:#1f3864}
.slide h2{border-bottom:3px solid #2e74b5;padding-bottom:6px;margin:0 0 12px;font-size:21px}
.slide h3{color:#2e5395;margin:10px 0 6px;font-size:14.5px}
.slide .snum{position:absolute;top:12px;right:16px;color:#8c8c8c;font-size:11.5px}
.slide table{width:100%;border-collapse:collapse;font-size:12.5px;margin:6px 0}
.slide th{background:#eef2f9;color:#1f3864;border:1px solid #d5dcea;padding:5px 8px;text-align:left;font-size:12px}
.slide td{border:1px solid #d5dcea;padding:5px 8px;vertical-align:top}
.slide .band{margin-top:12px;padding:8px 12px;border-radius:8px;font-size:12.5px;line-height:1.45}
.slide .band.q{background:#fff8e1;border:1px solid #f0c93a}
.slide .band.rule{background:#eef4fb;border:1px solid #9db7e0}
.slide .band.disc{background:#fdecea;border:1px solid #e57373}
.slide .badge{display:inline-block;background:#1f3864;border-radius:10px;padding:8px 16px;font-weight:800;font-size:16px}
.slide .badge,.slide .badge *{color:#fff}
.slide .pill{color:#fff}
.slide .catline{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.slide .catline span{border-radius:8px;padding:5px 9px;font-size:11.5px;font-weight:700;color:#fff}
.slide .mini{color:#6b7280}
.slide .cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.slide .kv{font-size:12.5px;line-height:1.6}
.slide .kv b{color:#1f3864}
@media print{.slide{page-break-after:always;box-shadow:none;border:none;max-width:none;border-radius:0;min-height:0}}
@media print{
  .topbar,.tabs,#toasts,#moverlay,.noprint{display:none!important}
  main{padding:0}section.tab{display:none!important}section.tab#printarea{display:block!important}
  body{background:#fff}
  .card{box-shadow:none;border:1px solid #bbb}
}
</style>
</head>
<body>
<div class="topbar">
  <div class="logo">НК</div>
  <h1>Аудит НИОКР · интерактивная модель оценки</h1>
  <span class="ver">v18.0 · этап 18</span>
  <div class="spacer"></div>
  <label style="font-size:12px">НИОКР:
    <select id="selRnd" style="min-width:220px"></select>
  </label>
  <button class="btn ghost sm" id="btnAdd">＋ НИОКР</button>
  <button class="btn ghost sm" id="btnBell">🔔 <span id="bellN">0</span></button>
  <button class="btn ghost sm" id="btnPush">Разрешить push</button>
  <label style="font-size:12px">Роль:
    <select id="selRole" aria-label="Роль пользователя">
      <option value="auditor">Аудитор</option>
      <option value="dept">Подразделение</option>
      <option value="fin">Финансы</option>
      <option value="exp">Техэксперт</option>
      <option value="view">Наблюдатель</option>
    </select>
  </label>
  <button class="btn ghost sm" id="btnTheme" title="Переключить тему (клавиша t)" aria-label="Переключить тему">🌙</button>
  <button class="btn ghost sm" id="btnTour" title="Онбординг-тур">🧭 Тур</button>
  <button class="btn ghost sm" id="btnHelp" title="Справка и горячие клавиши (?)">?</button>
  <button class="btn sm" id="btnSave">Сохранить</button>
  <button class="btn ghost sm" id="btnExp">Экспорт JSON</button>
  <button class="btn ghost sm" id="btnImp">Импорт</button>
  <input type="file" id="impFile" accept=".json" style="display:none">
</div>
<div class="tabs" id="tabs">
  <button data-t="dash" class="on">📊 Дашборд</button>
  <button data-t="check">✅ Опросник 15/30/60</button>
  <button data-t="evid">📎 Доказательства</button>
  <button data-t="anal">📈 Аналитика</button>
  <button data-t="wgt">⚖️ Веса (AHP)</button>
  <button data-t="pass">📄 Паспорт НИОКР</button>
  <button data-t="port">🗂 Портфель</button>
  <button data-t="flow">🔄 Маршрут</button>
  <button data-t="resp">👥 Респонденты</button>
  <button data-t="db">🗄 База НИОКР</button>
  <button data-t="viz">📉 Графики БД</button>
  <button data-t="prop">🎯 Предложения</button>
  <button data-t="ref">📚 Справочник</button>
  <button data-t="rep">🖨 Акт оценки</button>
  <button data-t="pres">🎞 Презентация</button>
</div>
<main>
  <section class="tab on" id="tab-dash"></section>
  <section class="tab" id="tab-check"></section>
  <section class="tab" id="tab-evid"></section>
  <section class="tab" id="tab-anal"></section>
  <section class="tab" id="tab-wgt"></section>
  <section class="tab" id="tab-pass"></section>
  <section class="tab" id="tab-port"></section>
  <section class="tab" id="tab-flow"></section>
  <section class="tab" id="tab-resp"></section>
  <section class="tab" id="tab-db"></section>
  <section class="tab" id="tab-viz"></section>
  <section class="tab" id="tab-prop"></section>
  <section class="tab" id="tab-ref"></section>
  <section class="tab" id="tab-rep"></section>
  <section class="tab" id="tab-pres"></section>
  <section class="tab" id="printarea"></section>
</main>
<div id="toasts"></div>
<div id="moverlay"><div class="modal" id="mbox"></div></div>

<script>
"use strict";
/* ================= ДАННЫЕ МЕТОДИКИ (v15.0, этап 15 — 31 критерий) =================
   Блок I «Актуальность» (10 критериев, 0–9) и Блок III «Целесообразность» (12 критериев, 19–30) —
   новая самостоятельная ЭКСПЕРТНАЯ МЕТОДИКА оценки актуальности и целесообразности (заменяют прежние
   блоки из 9+9 вопросов). Блок II «Эффективность» (9 вопросов, 10–18) сохранён. Итого 31 вопрос.
   Индексы А и Ц НЕ складываются, а сопоставляются через МАТРИЦУ РЕШЕНИЙ (expertRec);
   стоп-факторы блокируют обычную рекомендацию; заключение = 5 обязательных позиций (expertConclusion).
   Формат строки: [вопрос, подсказка, блок]  */
const NQ=31,NA=10,NB=9,NC=12; // A:0–9, B:10–18, C:19–30
const W=[30,35,35];
const BNAME=["А. Актуальность (I_А)","Б. Целесообразность (I_Ц)","В. Результативность (I_Р)"];
const BGOAL=["сохраняется ли потребность в результате и его актуальность сейчас и к моменту завершения НИОКР",
"насколько результаты соответствуют вложенным финансовым, трудовым и материальным ресурсам",
"целесообразно ли продолжать НИОКР: достижимость, ресурсы, потребитель, эффект, альтернативы и риски"];
const QS=[
["Сохраняется ли потребность заказчика в результатах НИОКР?","Есть ли действующая или перспективная потребность заказчика, подразделений и конечных пользователей? Подтверждена ли документально?",0],
["Соответствует ли НИОКР текущим и перспективным задачам организации?","Связана ли разработка со стратегией развития, техническим перевооружением и перспективными программами?",0],
["Соответствует ли результат современному научно-техническому уровню?","Не появились ли технологии, компоненты, алгоритмы, превосходящие разрабатываемые? Свежесть сравнительного анализа.",0],
["Содержит ли НИОКР технологическую новизну?","Оригинальные решения, преимущества, уникальные компетенции относительно известных аналогов.",0],
["Отсутствует ли дублирование других разработок? ★","Нет ли аналогичных или близких разработок внутри организации, в холдинге, в рамках кооперации?",0],
["Превосходит ли результат существующие рыночные аналоги? ★","Есть ли готовые отечественные или зарубежные решения, более эффективные по «цена — качество»? 🚩 стоп-фактор 1.",0],
["Соответствует ли результат действующим и вводимым нормативным требованиям?","Актуальные ГОСТ, ОСТ, техрегламенты, требования безопасности; учтены ли вводимые нормы.",0],
["Сохранит ли результат актуальность к моменту завершения НИОКР? ★","Прогноз устаревания к дате окончания работ; темп обновления технологии в отрасли.",0],
["Перспективна ли выбранная технология для отрасли?","Соответствие перспективным направлениям отрасли, технической политике и технологическому прогнозу организации.",0],
["Подтверждена ли потребность в результате на горизонте 3–5 лет? ★","Прогноз востребованности после завершения НИОКР; планы заказчика и серийные перспективы. 🚩 стоп-фактор 2.",0],
["Достигнуты ли цели и результаты, установленные ТЗ?","Сопоставлены ли фактические результаты с ТЗ, календарным планом и программой испытаний?",1],
["Соблюдены ли установленные сроки выполнения НИОКР?","Фактические отклонения от плановых сроков и их причины.",1],
["Соблюдён ли утверждённый бюджет НИОКР?","Плановые и фактические расходы, причины отклонений, допфинансирование. 🚩 стоп-фактор 3: «освоение» бюджета.",1],
["Рационально ли использованы трудовые и материальные ресурсы?","Трудозатраты, загрузка исполнителей, закупки против достигнутых результатов.",1],
["Достигнут ли запланированный научно-технический уровень?","Характеристики подтверждены расчётами, моделированием, испытаниями, сравнением с аналогами.",1],
["Сформирован ли реальный научно-технический задел?","РКД, ПО, технологии, методики, прототипы, РИД — повторно используемые результаты.",1],
["Все ли затраты связаны с результатом; нет ли повторных оплат? ★","Структура затрат: непрофильные расходы, двойные закрытия этапов, полнота первичных документов.",1],
["Учтены ли и используются ли закупленные, но не использованные ресурсы? ★","Остатки ТМЦ, простаивающее оборудование, возможность применения в других проектах.",1],
["Обоснована ли оставшаяся потребность в финансировании до завершения? ★","Смета оставшихся работ, прогноз итоговой стоимости, риски роста затрат.",1],
["Достижим ли результат выбранным способом в установленные сроки?","Обоснованность цели: подтверждена ли достижимость заявленных характеристик выбранным путём.",2],

  if(!all&&!V.some(v=>v.a!==""))return;
  const ns=V.map(v=>v.a).filter(a=>a!==""&&a!=="НП"&&a!=="НД").map(Number).filter(isFinite);
  const spread=ns.length?Math.max.apply(null,ns)-Math.min.apply(null,ns):0;

function donut(list){

  const total=list.length||1;let a0=-Math.PI/2,s='<svg viewBox="0 0 200 200" width="190">';

function finRow(k,lbl,r){return'<div class="field"><label>'+lbl+'</label><input type="number" step="0.01" data-p="fin.'+k+'" value="'+(r.fin[k]||"")+'" style="width:100%"></div>';}
function progTotal(r){const a=parseFloat(r.fin.fact),b=parseFloat(r.fin.prog);return(isFinite(a)&&isFinite(b))?(a+b).toFixed(2):"—";}
function devPct(r){const p=parseFloat(r.fin.plan),t=parseFloat(progTotal(r));return(isFinite(p)&&p&&isFinite(t))?((t/p-1)*100).toFixed(1)+" %":"—";}

  download("portfolio_niokr.csv",csv,"text/csv");notify("ok","CSV экспортирован","portfolio_niokr.csv");
}

/* ================= ВЕСА БЛОКОВ: AHP / СААТИ (этап 5) ================= */
const SAATI=[["9","9 — абсолютно важнее"],["8","8"],["7","7 — очень сильно важнее"],["6","6"],["5","5 — существенно важнее"],["4","4"],["3","3 — умеренно важнее"],["2","2"],["1","1 — равная важность"],["1/2","1/2 — правый умеренно важнее"],["1/3","1/3"],["1/4","1/4"],["1/5","1/5 — правый существенно важнее"],["1/6","1/6"],["1/7","1/7"],["1/8","1/8"],["1/9","1/9 — правый абсолютно важнее"]];
const BSHORT=["I. Актуальность","II. Эффективность","III. Целесообразность"];
function saatyVal(s){s=String(s);const v=s.indexOf("/")>0?1/Number(s.split("/")[1]):Number(s);return(isFinite(v)&&v>0)?v:1;}
function fmtA(x){return x>=1?(x%1?x.toFixed(2):String(x)):"1/"+Math.round(1/x);}
function ahpMatrix(a){const x=saatyVal(a.a12),y=saatyVal(a.a13),z=saatyVal(a.a23);return[[1,x,y],[1/x,1,z],[1/y,1/z,1]];}
function ahpEV(A){let v=[1/3,1/3,1/3];
 for(let k=0;k<200;k++){const nv=[A[0][0]*v[0]+A[0][1]*v[1]+A[0][2]*v[2],A[1][0]*v[0]+A[1][1]*v[1]+A[1][2]*v[2],A[2][0]*v[0]+A[2][1]*v[1]+A[2][2]*v[2]];
  const s=nv[0]+nv[1]+nv[2];nv[0]/=s;nv[1]/=s;nv[2]/=s;
  let dm=0;for(let i=0;i<3;i++)dm=Math.max(dm,Math.abs(nv[i]-v[i]));v=nv;if(dm<1e-12)break;}
 return v;}
function ahpStats(a){const A=ahpMatrix(a),w=ahpEV(A);

 return{wPct:w.map(x=>x*100),lmax,CI,CR};}
function crVerdict(CR){if(!(CR>=0))return["#c62828","⛔ Некорректные значения сравнений — проверьте матрицу"];return CR<0.1?["#2e7d32","✓ Согласовано: CR = "+CR.toFixed(3)+" < 0,1"]:CR<0.2?["#ef6c00","⚠ На грани: CR = "+CR.toFixed(3)+" — желательно уточнить суждения"]:["#c62828","⛔ Несогласовано: CR = "+CR.toFixed(3)+" — суждения противоречивы, пересмотрите сравнения"];}

function dbVisible(){
  const db=state.db,q=(db.q||"").trim().toLowerCase();
  return state.list.map((r,i)=>i).filter(i=>{const r=state.list[i],c=calc(r);
    if(q){const hay=(r.shifr+" "+r.name+" "+(r.podrazd||"")+" "+(r.head||"")).toLowerCase();if(hay.indexOf(q)<0)return false;}
    if(db.form&&(r.form||"")!==db.form)return false;
    if(db.status&&(r.status||"")!==db.status)return false;
    if(db.cat&&(c.cat||"Не оценена")!==db.cat)return false;
    if(db.hasFlow&&!flowOf(r))return false;
    if(db.hasResp&&!respOn(r))return false;
    return true;});
}
function dbSortIdx(vis){
  const s=state.db.sort,L=state.list;
  const I=i=>{const c=calc(L[i]);return c.I==null?-1:c.I;};
  const arr=vis.slice();
  if(s==="name_asc")arr.sort((a,b)=>(L[a].name||"").localeCompare(L[b].name||"","ru"));
  else if(s==="I_asc")arr.sort((a,b)=>I(a)-I(b));
  else if(s==="audits_desc")arr.sort((a,b)=>((L[b].audits||[]).length)-((L[a].audits||[]).length));
  else if(s==="created_desc")arr.sort((a,b)=>new Date(L[b].created||0)-new Date(L[a].created||0));
  else arr.sort((a,b)=>I(b)-I(a));
  return arr;
}

 const a=code=>{const p=q18pos(code);return p>=0?(A[p]||""):"";};
 const dev=parseFloat(devPct(r));
 if((a("А1")==="0"||a("А1")==="1")&&r.status!=="Завершена")
  out.push(["err","Потребность (код А1) оценена в "+a("А1")+" балла — статус «"+r.status+"» под вопросом"]);

 if(isFinite(dev)&&dev>15&&["4","5"].indexOf(a(ex.budget))>=0)
  out.push(["err","Прогнозное превышение бюджета δб = "+dev.toFixed(1)+" % при высокой оценке по коду "+ex.budget]);
 else if(isFinite(dev)&&dev>15&&a(ex.budget)==="")
  out.push(["warn","Превышение бюджета δб = "+dev.toFixed(1)+" %, код "+ex.budget+" не оценён"]);

 if(isFinite(ready)&&ready>=80&&["0","1","3"].indexOf(a(ex.imp))>=0)

 if(ev.viol.length)

 return out;}
