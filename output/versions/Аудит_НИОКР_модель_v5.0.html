<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Аудит НИОКР — интерактивная модель оценки, v1.0</title>
<style>
:root{
  --navy:#1f3864; --navy2:#2e5395; --accent:#2e74b5; --sky:#9db7e0;
  --bg:#f4f6fa; --card:#ffffff; --ink:#262626; --gray:#595959; --lgray:#8c8c8c;
  --red:#c62828; --orange:#ef6c00; --yellow:#fbc02d; --green:#2e7d32; --lgreen:#7cb342; --np:#9e9e9e;
  --input:#fff2cc; --shadow:0 2px 10px rgba(31,56,100,.10);
}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 "Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink)}
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;background:var(--navy);color:#fff;padding:10px 18px;flex-wrap:wrap}
.topbar .logo{width:34px;height:34px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
.topbar h1{font-size:16px;margin:0;font-weight:600}
.topbar .ver{background:var(--accent);border-radius:10px;padding:2px 9px;font-size:11px;font-weight:700}
.topbar .spacer{flex:1}
.btn{border:0;border-radius:8px;padding:8px 14px;font:600 12.5px "Segoe UI",sans-serif;cursor:pointer;background:var(--accent);color:#fff;transition:.15s}
.btn:hover{filter:brightness(1.12)}
.btn.ghost{background:transparent;color:#fff;border:1px solid var(--sky)}
.btn.warn{background:var(--orange)}
.btn.gray{background:#e8ebf2;color:var(--navy)}
.btn.sm{padding:5px 10px;font-size:11.5px}
select,input[type=text],input[type=number],textarea{font:13px "Segoe UI",sans-serif;border:1px solid #c6cede;border-radius:7px;padding:6px 8px;background:#fff;color:var(--ink)}
select:focus,textarea:focus,input:focus{outline:2px solid var(--sky)}
.tabs{display:flex;gap:4px;background:#e6ebf4;padding:8px 14px 0;flex-wrap:wrap;position:sticky;top:54px;z-index:30}
.tabs button{border:0;border-radius:9px 9px 0 0;padding:9px 16px;font:600 13px "Segoe UI",sans-serif;cursor:pointer;background:transparent;color:var(--gray)}
.tabs button.on{background:var(--bg);color:var(--navy);box-shadow:0 -2px 6px rgba(31,56,100,.08)}
main{padding:16px 18px 60px;max-width:1420px;margin:0 auto}
section.tab{display:none}
section.tab.on{display:block}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.card{background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:14px 16px}
.card h3{margin:0 0 10px;font-size:13px;color:var(--navy);text-transform:uppercase;letter-spacing:.4px}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi .v{font-size:30px;font-weight:800;color:var(--navy)}
.kpi .l{font-size:11.5px;color:var(--gray)}
.pill{display:inline-block;border-radius:10px;padding:2px 10px;font-size:11.5px;font-weight:700;color:#fff}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{background:var(--navy);color:#fff;padding:7px 8px;text-align:left;font-size:11.5px}
td{border:1px solid #e2e7f0;padding:6px 8px;vertical-align:top}
tr:nth-child(even) td{background:#f6f8fc}
.qrow{border:1px solid #e2e7f0;border-radius:10px;background:#fff;margin-bottom:10px;overflow:hidden}
.qrow .qh{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;background:#f6f8fc}
.qrow .num{min-width:26px;height:26px;border-radius:7px;background:var(--navy2);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}
.qrow .qt{flex:1}
.qrow .qt b{font-size:13px}
.qrow .qt .est{display:block;color:var(--gray);font-size:11.5px;margin-top:3px}
.qrow .qb{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:9px 12px}
.score-chip{min-width:38px;text-align:center;border-radius:8px;padding:5px 8px;font-weight:800;color:#fff;background:var(--np)}
.blk-h{display:flex;align-items:center;gap:10px;background:var(--navy);color:#fff;border-radius:10px;padding:9px 14px;margin:16px 0 10px;font-weight:700}
.blk-h .w{margin-left:auto;background:var(--accent);border-radius:9px;padding:2px 10px;font-size:12px}
.blk-sum{display:flex;gap:18px;flex-wrap:wrap;background:#eef3fa;border-radius:10px;padding:9px 14px;font-size:12.5px;margin-bottom:6px}
.blk-sum b{color:var(--navy)}
.heat{display:flex;gap:3px;flex-wrap:wrap}
.heat div{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:10.5px;font-weight:700;cursor:pointer}
#toasts{position:fixed;top:64px;right:16px;z-index:90;display:flex;flex-direction:column;gap:8px;max-width:360px}
.toast{border-radius:10px;padding:10px 14px;color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.25);font-size:12.5px;animation:tin .25s;display:flex;gap:9px;align-items:flex-start}
.toast .ic{font-size:15px}
.toast.ok{background:var(--green)}.toast.warn{background:var(--orange)}.toast.err{background:var(--red)}.toast.info{background:var(--navy2)}
@keyframes tin{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
#moverlay{position:fixed;inset:0;background:rgba(20,30,55,.55);z-index:80;display:none;align-items:center;justify-content:center;padding:20px}
#moverlay.on{display:flex}
.modal{background:#fff;border-radius:14px;max-width:640px;width:100%;max-height:86vh;overflow:auto;padding:20px 22px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal h2{margin:0 0 10px;font-size:17px;color:var(--navy)}
.modal .mbtns{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.feed{max-height:230px;overflow:auto}
.feed .fi{border-left:4px solid var(--accent);background:#f4f7fc;border-radius:0 8px 8px 0;padding:6px 10px;margin-bottom:6px;font-size:12px}
.feed .fi.warn{border-color:var(--orange)}.feed .fi.err{border-color:var(--red)}.feed .fi.ok{border-color:var(--green)}
.field{display:grid;grid-template-columns:230px 1fr;gap:8px;align-items:center;margin-bottom:7px}
.field label{font-size:12.5px;color:var(--gray);font-weight:600}
.note{background:#fbf6e9;border-left:4px solid var(--yellow);border-radius:0 8px 8px 0;padding:9px 12px;font-size:12.5px;margin:10px 0}
.formula{background:#10233f;color:#cfe3ff;border-radius:9px;padding:10px 14px;font:12.5px/1.6 Consolas,monospace;overflow:auto}
.src a{color:var(--accent)}
.mini{font-size:11px;color:var(--lgray)}
.bar{height:14px;border-radius:7px;background:#e6ebf4;overflow:hidden}
.bar i{display:block;height:100%;border-radius:7px}
/* ---------- тёмная тема (этап 4) ---------- */
body.dark{--bg:#131a27;--card:#1c2536;--ink:#e8ecf5;--gray:#a9b4c8;--lgray:#7d8aa3;--input:#26334a;--shadow:0 2px 12px rgba(0,0,0,.45)}
body.dark .topbar{background:#0e1522}
body.dark .tabs{background:#0e1522}
body.dark .tabs button{color:#8fa1bf}
body.dark .tabs button.on{background:#131a27;color:#cfe3ff}
body.dark select,body.dark input[type=text],body.dark input[type=number],body.dark textarea{background:#243044;color:#e8ecf5;border-color:#3b4c6b}
body.dark input[readonly]{background:#1a2334!important}
body.dark th{background:#16233c}
body.dark td{border-color:#2c3a52}
body.dark tr:nth-child(even) td{background:#202c42}
body.dark .qrow{background:#1c2536;border-color:#2c3a52}
body.dark .qrow .qh{background:#202c42}
body.dark .qrow .qt .est{color:#a9b4c8}
body.dark .blk-h{background:#16233c}
body.dark .blk-sum{background:#202c42}
body.dark .blk-sum b{color:#9db7e0}
body.dark .card h3{color:#9db7e0}
body.dark .note{background:#2b2612;border-color:#fbc02d}
body.dark .formula{background:#0b1526;border:1px solid #22304a}
body.dark .feed .fi{background:#202c42}
body.dark .modal{background:#1c2536;color:#e8ecf5}
body.dark .field label{color:#a9b4c8}
body.dark .bar{background:#202c42}
body.dark .btn.gray{background:#243044;color:#cfe3ff}
body.dark .heat div[style*="dfe6f2"]{background:#243044!important}
body.dark .kpi .v{color:#cfe3ff}
body.dark .mini{color:#7d8aa3}
@media print{
  .topbar,.tabs,#toasts,#moverlay,.noprint{display:none!important}
  main{padding:0}section.tab{display:none!important}section.tab#printarea{display:block!important}
  body{background:#fff}
  .card{box-shadow:none;border:1px solid #bbb}
}
</style>
</head>

/* ================= РАСЧЁТ ================= */
function calcCore(ans,Wv){
  Wv=Wv||W;
  const bl=[0,1,2].map(b=>{let S=0,N=0;
    for(let i=0;i<27;i++){if(QS[i][2]!==b)continue;const a=ans[i];if(a===""||a==="НП")continue;S+=Number(a);N++;}
    const P=N?S/(5*N):null;return{S,N,P,B:P==null?0:Wv[b]*P,Wapp:P==null?0:Wv[b]};});
  const Wsum=bl.reduce((s,x)=>s+x.Wapp,0),Bsum=bl.reduce((s,x)=>s+x.B,0);
  const I=Wsum?100*Bsum/Wsum:null;
  let cat=null,rec=null,col="#9e9e9e";
  if(I!=null){for(const c of CATS){if(I>=c[0]){cat=c[1];rec=c[3];col=c[2];break;}}}
  return{bl,I,cat,rec,col,Wsum,renorm:Wsum>0&&Wsum<100};
}
function calc(r){
  const c=calcCore(r.ans,state.weights);
  c.nCtrl=r.ctrl.filter(x=>x==="Выявлено").length;
  return c;
}
const cur=()=>state.list[state.cur];

/* ================= УВЕДОМЛЕНИЯ ================= */
function toast(type,title,msg){
  const ic={ok:"✅",warn:"⚠️",err:"⛔",info:"ℹ️"}[type]||"ℹ️";
  const d=document.createElement("div");d.className="toast "+type;d.setAttribute("role","status");
  d.innerHTML='<span class="ic">'+ic+'</span><div><b>'+title+'</b><div>'+msg+'</div></div>';
  document.getElementById("toasts").appendChild(d);
  setTimeout(()=>{d.style.opacity="0";d.style.transition=".4s";setTimeout(()=>d.remove(),400);},6500);
}
function notify(type,title,msg){
  state.feed.unshift({t:new Date().toLocaleTimeString("ru-RU"),type,title,msg});
  if(state.feed.length>40)state.feed.pop();
  document.getElementById("bellN").textContent=state.feed.length;
  toast(type,title,msg);
  if(state.push&&"Notification" in window&&Notification.permission==="granted"){
    try{new Notification(title,{body:msg});}catch(e){}
  }
}

/* ================= SVG-ГРАФИКИ ================= */
function polar(cx,cy,r,a){const x=cx+r*Math.cos(a),y=cy+r*Math.sin(a);return[x,y];}
function arc(cx,cy,r,a0,a1){const[p0,p1]=[polar(cx,cy,r,a0),polar(cx,cy,r,a1)];
  return"M"+p0[0]+" "+p0[1]+" A"+r+" "+r+" 0 "+((a1-a0)>Math.PI?1:0)+" 1 "+p1[0]+" "+p1[1];}
function gauge(I){
  const cx=110,cy=105,r=86;let s='<svg viewBox="0 0 220 125" width="240">';
  const zones=[[0,30,"#c62828"],[30,50,"#ef6c00"],[50,70,"#fbc02d"],[70,85,"#7cb342"],[85,100,"#2e7d32"]];
  for(const z of zones){const a0=Math.PI+(z[0]/100)*Math.PI,a1=Math.PI+(z[1]/100)*Math.PI;
    s+='<path d="'+arc(cx,cy,r,a0,a1)+'" stroke="'+z[2]+'" stroke-width="16" fill="none" stroke-linecap="butt"/>';}
  if(I!=null){const a=Math.PI+(I/100)*MathPIfix();const[p]= [polar(cx,cy,r-24,a)];
    s+='<line x1="'+cx+'" y1="'+cy+'" x2="'+p[0]+'" y2="'+p[1]+'" stroke="#1f3864" stroke-width="4" stroke-linecap="round"/>';
    s+='<circle cx="'+cx+'" cy="'+cy+'" r="6" fill="#1f3864"/>';
    s+='<text x="'+cx+'" y="'+(cy-14)+'" text-anchor="middle" font-size="26" font-weight="800" fill="#1f3864">'+I.toFixed(1)+'</text>';}
  else{s+='<text x="'+cx+'" y="'+(cy-14)+'" text-anchor="middle" font-size="15" font-weight="700" fill="#9e9e9e">Н/П</text>';}
  s+='<text x="14" y="120" font-size="10" fill="#8c8c8c">0</text><text x="196" y="120" font-size="10" fill="#8c8c8c">100</text></svg>';
  return s;
}
function MathPIfix(){return Math.PI;}
function radar(bl){
  const cx=110,cy=100,R=78;let s='<svg viewBox="0 0 220 200" width="250">';
  const ang=[-Math.PI/2,Math.PI/2+Math.PI/6*5,Math.PI/2+Math.PI/6];
  for(const g of[0.33,0.66,1]){s+='<polygon points="'+ang.map(a=>{const[x,y]=polar(cx,cy,R*g,a);return x+","+y;}).join(" ")+'" fill="none" stroke="#dfe6f2"/>';}
  ang.forEach(a=>{const[x,y]=polar(cx,cy,R,a);s+='<line x1="'+cx+'" y1="'+cy+'" x2="'+x+'" y2="'+y+'" stroke="#dfe6f2"/>';});
  const pts=ang.map((a,i)=>{const v=bl[i].P==null?0:bl[i].P;const[x,y]=polar(cx,cy,R*v,a);return x+","+y;}).join(" ");
  s+='<polygon points="'+pts+'" fill="rgba(46,116,181,.30)" stroke="#2e74b5" stroke-width="2"/>';
  const lbl=["Актуальность","Эффективность","Целесообразность"];
  ang.forEach((a,i)=>{const[x,y]=polar(cx,cy,R+16,a);s+='<text x="'+x+'" y="'+y+'" text-anchor="middle" font-size="10.5" fill="#595959">'+lbl[i]+'</text>';});
  return s+'</svg>';
}
function bars(bl){
  let h='<div style="display:flex;flex-direction:column;gap:9px">';
  bl.forEach((b,i)=>{const p=b.P==null?0:b.P*100;
    h+='<div><div style="display:flex;justify-content:space-between;font-size:12px"><span>'+BNAME[i]+'</span><b>'+(b.P==null?"Н/П":p.toFixed(1)+" %")+' · B='+b.B.toFixed(1)+'</b></div>'+
    '<div class="bar"><i style="width:'+p+'%;background:'+(p>=70?"#2e7d32":p>=50?"#fbc02d":"#c62828")+'"></i></div></div>';});
  return h+'</div>';
}
function donut(list){
  const cnt={};list.forEach(r=>{const c=calc(r);const k=c.cat||"Не оценена";cnt[k]=(cnt[k]||0)+1;});
  const cols={"Высокая":"#2e7d32","Хорошая":"#7cb342","Удовлетворительная":"#fbc02d","Неудовлетворительная":"#ef6c00","Критическая":"#c62828","Не оценена":"#9e9e9e"};
  const total=list.length||1;let a0=-Math.PI/2,s='<svg viewBox="0 0 200 200" width="190">';
  for(const k in cnt){const frac=cnt[k]/total,a1=a0+frac*2*Math.PI;
    s+='<path d="'+arc(100,100,70,a0,a1)+'" stroke="'+(cols[k]||"#9e9e9e")+'" stroke-width="30" fill="none"/>';
    a0=a1;}
  s+='<text x="100" y="96" text-anchor="middle" font-size="26" font-weight="800" fill="#1f3864">'+total+'</text>'+
     '<text x="100" y="114" text-anchor="middle" font-size="10" fill="#8c8c8c">НИОКР в портфеле</text></svg>';
  let leg='<div style="font-size:12px">';for(const k in cnt){leg+='<div><span class="pill" style="background:'+(cols[k]||"#9e9e9e")+'">'+cnt[k]+'</span> '+k+'</div>';}
  return s+leg+'</div>';
}

/* ================= РЕНДЕР: ЧЕК-ЛИСТ ================= */
function renderCheck(){
  const r=cur();let h='<div class="note">Заполните ответ и документальное подтверждение по каждому вопросу. Баллы 4–5 без подтверждения («Нет») блокируются предупреждением. «Н/П» требует обоснования в комментарии и исключается из расчёта блока.</div>';
  for(let b=0;b<3;b++){
    h+='<div class="blk-h">БЛОК '+BNAME[b].split(". ")[0]+'. '+BNAME[b].split(". ")[1].toUpperCase()+'<span style="font-weight:400;font-size:12px">· цель: '+BGOAL[b]+'</span><span class="w">вес '+fmtW1(state.weights[b])+' %</span></div>';
    const c=calc(r).bl[b];
    h+='<div class="blk-sum"><span>Sⱼ (сумма баллов): <b>'+c.S+'</b></span><span>Nⱼ (применимо): <b>'+c.N+'</b> / 9</span><span>Pⱼ (выполнение): <b>'+(c.P==null?"Н/П":(c.P*100).toFixed(1)+" %")+'</b></span><span>Bⱼ (взвешенный): <b>'+c.B.toFixed(2)+' / '+fmtW1(state.weights[b])+'</b></span></div>';
    for(let i=0;i<27;i++){if(QS[i][2]!==b)continue;
      const a=r.ans[i],sc=a===""||a==="НП"?null:Number(a);
      h+='<div class="qrow"><div class="qh"><div class="num">'+(i+1)+'</div><div class="qt"><b>'+QS[i][0]+'</b><span class="est">'+QS[i][1]+'</span></div>'+
      '<span class="score-chip" style="background:'+(a===""?"#dfe6f2;color:#8c8c8c":SCORE_COLOR[a])+'">'+(sc==null?(a==="НП"?"Н/П":"—"):sc)+'</span></div>'+
      '<div class="qb"><label>Ответ: <select data-a="'+i+'"><option value="">— не выбран —</option>'+ANS.map(o=>'<option value="'+o[0]+'"'+(a===o[0]?" selected":"")+'>'+o[1]+'</option>').join("")+'</select></label>'+
      '<label>Подтверждение: <select data-c="'+i+'"><option value="">—</option><option value="Да"'+(r.conf[i]==="Да"?" selected":"")+'>Да</option><option value="Нет"'+(r.conf[i]==="Нет"?" selected":"")+'>Нет</option></select></label>'+
      '<input type="text" data-m="'+i+'" placeholder="Комментарий / документы / обоснование «Н/П»" value="'+(r.com[i]||"").replace(/"/g,"&quot;")+'" style="flex:1;min-width:240px">'+
      '</div></div>';}
  }
  document.getElementById("tab-check").innerHTML=h;
  document.querySelectorAll("#tab-check select[data-a]").forEach(el=>el.onchange=e=>setAns(+e.target.dataset.a,e.target.value));
  document.querySelectorAll("#tab-check select[data-c]").forEach(el=>el.onchange=e=>setConf(+e.target.dataset.c,e.target.value));
  document.querySelectorAll("#tab-check input[data-m]").forEach(el=>el.onchange=e=>{cur().com[+e.target.dataset.m]=e.target.value;save();});
  if(!canCheck()){
    document.querySelectorAll("#tab-check select,#tab-check input").forEach(el=>el.disabled=true);
    document.getElementById("tab-check").insertAdjacentHTML("afterbegin",
    '<div class="note">🔒 Роль «'+(state.role==="dept"?"Подразделение":"Наблюдатель")+'»: выставление баллов чек-листа доступно только роли «Аудитор». Переключите роль в верхней панели, если вы член комиссии.</div>');
  }
}
function setAns(i,v){
  const r=cur();r.ans[i]=v;
  if(v==="НП"&&!(r.com[i]||"").trim()){
    showModal('<h2>Обоснование ответа «Н/П» — вопрос '+(i+1)+'</h2><p>Ответ «Н/П» исключает вопрос из числителя и знаменателя расчёта блока. Укажите причину неприменимости (обязательно):</p><textarea id="npTxt" rows="3" style="width:100%"></textarea>',
    [{label:"Отмена",cls:"gray",fn:()=>{r.ans[i]="";renderCheck();renderDash();}},{label:"Сохранить обоснование",fn:()=>{r.com[i]=document.getElementById("npTxt").value||"Н/П без пояснения";notify("warn","Вопрос "+(i+1)+" исключён из расчёта","«Н/П»: "+r.com[i]);afterChange();}}]);
  }else if((v==="4"||v==="5")&&r.conf[i]==="Нет"){
    ruleWarn(i);
  }else if(v!==""){notify("ok","Вопрос "+(i+1)+" оценён","Ответ: "+ANS.find(x=>x[0]===v)[1]+" → "+(v==="НП"?"исключён":v+" балл(ов)"));afterChange();}
  else afterChange();
}
function setConf(i,v){
  const r=cur();r.conf[i]=v;
  if((r.ans[i]==="4"||r.ans[i]==="5")&&v==="Нет")ruleWarn(i);
  else{save();renderCheck();renderDash();}
}
function ruleWarn(i){
  showModal('<h2>⚠️ Нарушение правила документального подтверждения</h2><p>По вопросу <b>'+(i+1)+'</b> выставлен высокий балл (<b>'+(cur().ans[i]==="4"?"4":"5")+'</b>) при отсутствии документального подтверждения. Согласно методике, баллы 4–5 не могут присваиваться только на основании устных пояснений исполнителя.</p><p>Действия: приложите документ и выберите «Да», либо снизьте балл.</p>',
  [{label:"Снизить балл до 3",cls:"warn",fn:()=>{cur().ans[i]="3";notify("warn","Балл снижен","Вопрос "+(i+1)+": 5/4 → 3 (нет подтверждения)");afterChange();}},
   {label:"Оставить (риск комиссии)",cls:"gray",fn:()=>{notify("err","Зафиксировано нарушение правила","Вопрос "+(i+1)+": высокий балл без документа — комиссия обязана проверить");afterChange();}}]);
}
function afterChange(){
  const r=cur(),c=calc(r);
  if(c.cat&&c.cat!==r.cat){notify("info","Категория изменилась: "+c.cat,"I = "+(c.I==null?"Н/П":c.I.toFixed(1))+" · "+c.rec);r.cat=c.cat;}
  save();renderCheck();renderDash();renderPort();renderSel();
}

  '<div class="field"><label>Руководитель НИОКР</label>'+f("head","должность, ФИО")+'</div>'+
  '<div class="field"><label>Краткая цель</label>'+f("goal","какую проблему решает")+'</div>'+
  '<div class="field"><label>Ключевой результат</label>'+f("product","образец / ПО / технология / документация")+'</div>'+

  finRow("plan","Утверждённая (первоначальная) стоимость",r)+finRow("fact","Фактические затраты",r)+finRow("prog","Прогноз затрат до завершения",r)+
  '<div class="field"><label>Прогнозная итоговая стоимость</label><input type="text" readonly value="'+progTotal(r)+'" style="width:100%;background:#f2f2f2"></div>'+
  '<div class="field"><label>Отклонение от утверждённой</label><input type="text" readonly value="'+devPct(r)+'" style="width:100%;background:#f2f2f2"></div>'+

  CTRL.map((c,i)=>'<div class="field"><label style="font-weight:400">'+(i+1)+'. '+c[0]+'</label><select data-k="'+i+'"><option value="">—</option><option'+(r.ctrl[i]==="Выявлено"?" selected":"")+'>Выявлено</option><option'+(r.ctrl[i]==="Не выявлено"?" selected":"")+'>Не выявлено</option><option'+(r.ctrl[i]==="Требует проверки"?" selected":"")+'>Требует проверки</option></select></div>').join("")+

  '<div class="field" style="align-items:start"><label>Обоснование</label><textarea data-p="just" rows="2" style="width:100%">'+(r.just||"")+'</textarea></div>'+

  '</div></div>';
  document.getElementById("tab-pass").innerHTML=h;
  document.querySelectorAll("#tab-pass [data-p]").forEach(el=>el.onchange=e=>{const k=e.target.dataset.p;
    if(k.indexOf("fin.")===0){cur().fin[k.slice(4)]=e.target.value;}else{cur()[k]=e.target.value;}
    save();renderSel();renderDash();renderPort();renderPass();});
  document.querySelectorAll("#tab-pass [data-k]").forEach(el=>el.onchange=e=>{const i=+e.target.dataset.k;cur().ctrl[i]=e.target.value;

function finRow(k,lbl,r){return'<div class="field"><label>'+lbl+'</label><input type="number" step="0.01" data-p="fin.'+k+'" value="'+(r.fin[k]||"")+'" style="width:100%"></div>';}
function progTotal(r){const a=parseFloat(r.fin.fact),b=parseFloat(r.fin.prog);return(isFinite(a)&&isFinite(b))?(a+b).toFixed(2):"—";}
function devPct(r){const p=parseFloat(r.fin.plan),t=parseFloat(progTotal(r));return(isFinite(p)&&p&&isFinite(t))?((t/p-1)*100).toFixed(1)+" %":"—";}

/* ================= РЕНДЕР: ПОРТФЕЛЬ ================= */
function renderPort(){
  let rows=state.list.map((r,i)=>{const c=calc(r);
    return'<tr><td>'+(i+1)+'</td><td><b>'+r.shifr+'</b><br><span class="mini">'+r.name+'</span></td><td>'+r.status+'</td>'+
    '<td>'+(r.fin.plan||"—")+'</td><td>'+(r.ready||"—")+'%</td>'+
    '<td style="text-align:center;font-weight:800;color:'+c.col+'">'+(c.I==null?"Н/П":c.I.toFixed(1))+'</td>'+
    '<td><span class="pill" style="background:'+c.col+'">'+(c.cat||"Не оценена")+'</span></td>'+
    '<td><select data-d="'+i+'" style="width:100%"><option value="">—</option>'+DECISIONS.map(d=>'<option'+(r.decision===d?" selected":"")+'>'+d+'</option>').join("")+'</select></td>'+
    '<td style="text-align:center"><button class="btn sm gray" data-open="'+i+'">открыть</button> <button class="btn sm warn" data-del="'+i+'">✕</button></td></tr>';}).join("");
  const avg=state.list.map(r=>calc(r).I).filter(x=>x!=null);
  document.getElementById("tab-port").innerHTML=
  '<div class="grid g3"><div class="card"><h3>Распределение по категориям</h3>'+donut(state.list)+'</div>'+
  '<div class="card kpi"><span class="l">НИОКР в портфеле</span><span class="v">'+state.list.length+'</span><span class="l">выполняется: '+state.list.filter(r=>r.status==="Выполняется").length+' · приостановлено: '+state.list.filter(r=>r.status==="Приостановлена").length+'</span></div>'+
  '<div class="card kpi"><span class="l">СРЕДНИЙ ИНТЕГРАЛЬНЫЙ БАЛЛ</span><span class="v">'+(avg.length?(avg.reduce((a,b)=>a+b,0)/avg.length).toFixed(1):"—")+'</span><span class="l">кандидаты на прекращение (I&lt;50): '+state.list.filter(r=>{const c=calc(r);return c.I!=null&&c.I<50;}).length+'</span></div></div>'+
  '<div class="card" style="margin-top:14px"><h3>Сводная матрица портфеля</h3><table><tr><th>№</th><th>Шифр / наименование</th><th>Статус</th><th>Стоимость, млн ₽</th><th>Готовность</th><th>I</th><th>Категория</th><th>Управленческое решение</th><th></th></tr>'+rows+'</table>'+
  '<div style="margin-top:10px" class="noprint"><button class="btn" id="pAdd">＋ Добавить НИОКР</button> <button class="btn gray" id="pCsv">Экспорт CSV</button></div></div>';
  document.querySelectorAll("#tab-port select[data-d]").forEach(el=>el.onchange=e=>{state.list[+e.target.dataset.d].decision=e.target.value;save();notify("ok","Решение зафиксировано",state.list[+e.target.dataset.d].shifr+": "+e.target.value);});
  document.querySelectorAll("#tab-port [data-open]").forEach(el=>el.onclick=e=>{state.cur=+e.target.dataset.open;save();renderSel();goTab("dash");});
  document.querySelectorAll("#tab-port [data-del]").forEach(el=>el.onclick=e=>{const i=+e.target.dataset.del;
    showModal('<h2>Удалить НИОКР из портфеля?</h2><p><b>'+state.list[i].shifr+' — '+state.list[i].name+'</b> будет удалена вместе с ответами чек-листа.</p>',
    [{label:"Отмена",cls:"gray"},{label:"Удалить",cls:"warn",fn:()=>{state.list.splice(i,1);if(state.cur>=state.list.length)state.cur=0;if(!state.list.length)state.list.push(newRnd());save();renderAll();notify("warn","НИОКР удалена из портфеля","");}}]);});
  const pa=document.getElementById("pAdd");if(pa){pa.onclick=addRnd;if(!canPort())pa.disabled=true;}
  const pc=document.getElementById("pCsv");if(pc)pc.onclick=exportCsv;
  if(!canPort()){
    document.querySelectorAll("#tab-port select[data-d],#tab-port [data-del],#tab-port [data-open]").forEach(el=>el.disabled=true);
  }
}
function exportCsv(){
  let csv="Шифр;Наименование;Статус;Стоимость;Готовность;I;Категория;Решение\n";
  state.list.forEach(r=>{const c=calc(r);csv+=[r.shifr,r.name,r.status,r.fin.plan||"",r.ready||"",c.I==null?"":c.I.toFixed(1),c.cat||"",r.decision||""].join(";")+"\n";});
  download("portfolio_niokr.csv",csv,"text/csv");notify("ok","CSV экспортирован","portfolio_niokr.csv");
}

const SCALEV=[0,1,3,4,5];
function mulberry(seed){let s=seed>>>0;return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function mcRun(r,N,seed){
  const rnd=mulberry(seed);
  const idx=[];for(let i=0;i<27;i++){const a=r.ans[i];if(a!==""&&a!=="НП")idx.push(i);}
  const out=[];
  for(let k=0;k<N;k++){
    const ans=r.ans.slice();
    for(const i of idx){
      const u=rnd(),p=SCALEV.indexOf(Number(r.ans[i]));
      if(u<0.15)ans[i]=String(SCALEV[Math.max(0,p-1)]);
      else if(u<0.30)ans[i]=String(SCALEV[Math.min(4,p+1)]);
    }
    out.push(calcCore(ans,state.weights).I);
  }
  return out;
}
