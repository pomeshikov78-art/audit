<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Аудит НИОКР — интерактивная модель оценки, v1.0</title>
<style>
:root{
  --navy:#1f3864; --navy2:#2e5395; --accent:#2e74b5; --sky:#9db7e0;
  --bg:#f4f6fa; --card:#ffffff; --ink:#262626; --gray:#595959; --lgray:#8c8c8c;
  --red:#c62828; --orange:#ef6c00; --yellow:#fbc02d; --green:#2e7d32; --lgreen:#7cb342; --np:#9e9e9e;
  --input:#fff2cc; --shadow:0 2px 10px rgba(31,56,100,.10);
}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 "Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink)}
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;background:var(--navy);color:#fff;padding:10px 18px;flex-wrap:wrap}
.topbar .logo{width:34px;height:34px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
.topbar h1{font-size:16px;margin:0;font-weight:600}
.topbar .ver{background:var(--accent);border-radius:10px;padding:2px 9px;font-size:11px;font-weight:700}
.topbar .spacer{flex:1}
.btn{border:0;border-radius:8px;padding:8px 14px;font:600 12.5px "Segoe UI",sans-serif;cursor:pointer;background:var(--accent);color:#fff;transition:.15s}
.btn:hover{filter:brightness(1.12)}
.btn.ghost{background:transparent;color:#fff;border:1px solid var(--sky)}
.btn.warn{background:var(--orange)}
.btn.gray{background:#e8ebf2;color:var(--navy)}
.btn.sm{padding:5px 10px;font-size:11.5px}
select,input[type=text],input[type=number],textarea{font:13px "Segoe UI",sans-serif;border:1px solid #c6cede;border-radius:7px;padding:6px 8px;background:#fff;color:var(--ink)}
select:focus,textarea:focus,input:focus{outline:2px solid var(--sky)}
.tabs{display:flex;gap:4px;background:#e6ebf4;padding:8px 14px 0;flex-wrap:wrap;position:sticky;top:54px;z-index:30}
.tabs button{border:0;border-radius:9px 9px 0 0;padding:9px 16px;font:600 13px "Segoe UI",sans-serif;cursor:pointer;background:transparent;color:var(--gray)}
.tabs button.on{background:var(--bg);color:var(--navy);box-shadow:0 -2px 6px rgba(31,56,100,.08)}
main{padding:16px 18px 60px;max-width:1420px;margin:0 auto}
section.tab{display:none}
section.tab.on{display:block}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.card{background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:14px 16px}
.card h3{margin:0 0 10px;font-size:13px;color:var(--navy);text-transform:uppercase;letter-spacing:.4px}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi .v{font-size:30px;font-weight:800;color:var(--navy)}
.kpi .l{font-size:11.5px;color:var(--gray)}
.pill{display:inline-block;border-radius:10px;padding:2px 10px;font-size:11.5px;font-weight:700;color:#fff}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{background:var(--navy);color:#fff;padding:7px 8px;text-align:left;font-size:11.5px}
td{border:1px solid #e2e7f0;padding:6px 8px;vertical-align:top}
tr:nth-child(even) td{background:#f6f8fc}
.qrow{border:1px solid #e2e7f0;border-radius:10px;background:#fff;margin-bottom:10px;overflow:hidden}
.qrow .qh{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;background:#f6f8fc}
.qrow .num{min-width:26px;height:26px;border-radius:7px;background:var(--navy2);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}
.qrow .qt{flex:1}
.qrow .qt b{font-size:13px}
.qrow .qt .est{display:block;color:var(--gray);font-size:11.5px;margin-top:3px}
.qrow .qb{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:9px 12px}
.score-chip{min-width:38px;text-align:center;border-radius:8px;padding:5px 8px;font-weight:800;color:#fff;background:var(--np)}
.blk-h{display:flex;align-items:center;gap:10px;background:var(--navy);color:#fff;border-radius:10px;padding:9px 14px;margin:16px 0 10px;font-weight:700}
.blk-h .w{margin-left:auto;background:var(--accent);border-radius:9px;padding:2px 10px;font-size:12px}
.blk-sum{display:flex;gap:18px;flex-wrap:wrap;background:#eef3fa;border-radius:10px;padding:9px 14px;font-size:12.5px;margin-bottom:6px}
.blk-sum b{color:var(--navy)}
.heat{display:flex;gap:3px;flex-wrap:wrap}
.heat div{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:10.5px;font-weight:700;cursor:pointer}
#toasts{position:fixed;top:64px;right:16px;z-index:90;display:flex;flex-direction:column;gap:8px;max-width:360px}
.toast{border-radius:10px;padding:10px 14px;color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.25);font-size:12.5px;animation:tin .25s;display:flex;gap:9px;align-items:flex-start}
.toast .ic{font-size:15px}
.toast.ok{background:var(--green)}.toast.warn{background:var(--orange)}.toast.err{background:var(--red)}.toast.info{background:var(--navy2)}
@keyframes tin{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
#moverlay{position:fixed;inset:0;background:rgba(20,30,55,.55);z-index:80;display:none;align-items:center;justify-content:center;padding:20px}
#moverlay.on{display:flex}
.modal{background:#fff;border-radius:14px;max-width:640px;width:100%;max-height:86vh;overflow:auto;padding:20px 22px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal h2{margin:0 0 10px;font-size:17px;color:var(--navy)}
.modal .mbtns{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.feed{max-height:230px;overflow:auto}
.feed .fi{border-left:4px solid var(--accent);background:#f4f7fc;border-radius:0 8px 8px 0;padding:6px 10px;margin-bottom:6px;font-size:12px}
.feed .fi.warn{border-color:var(--orange)}.feed .fi.err{border-color:var(--red)}.feed .fi.ok{border-color:var(--green)}
.field{display:grid;grid-template-columns:230px 1fr;gap:8px;align-items:center;margin-bottom:7px}
.field label{font-size:12.5px;color:var(--gray);font-weight:600}
.note{background:#fbf6e9;border-left:4px solid var(--yellow);border-radius:0 8px 8px 0;padding:9px 12px;font-size:12.5px;margin:10px 0}
.formula{background:#10233f;color:#cfe3ff;border-radius:9px;padding:10px 14px;font:12.5px/1.6 Consolas,monospace;overflow:auto}
.src a{color:var(--accent)}
.mini{font-size:11px;color:var(--lgray)}
.bar{height:14px;border-radius:7px;background:#e6ebf4;overflow:hidden}
.bar i{display:block;height:100%;border-radius:7px}
/* ---------- тёмная тема (этап 4) ---------- */
body.dark{--bg:#131a27;--card:#1c2536;--ink:#e8ecf5;--gray:#a9b4c8;--lgray:#7d8aa3;--input:#26334a;--shadow:0 2px 12px rgba(0,0,0,.45)}
body.dark .topbar{background:#0e1522}
body.dark .tabs{background:#0e1522}
body.dark .tabs button{color:#8fa1bf}
body.dark .tabs button.on{background:#131a27;color:#cfe3ff}
body.dark select,body.dark input[type=text],body.dark input[type=number],body.dark textarea{background:#243044;color:#e8ecf5;border-color:#3b4c6b}
body.dark input[readonly]{background:#1a2334!important}
body.dark th{background:#16233c}
body.dark td{border-color:#2c3a52}
body.dark tr:nth-child(even) td{background:#202c42}
body.dark .qrow{background:#1c2536;border-color:#2c3a52}
body.dark .qrow .qh{background:#202c42}
body.dark .qrow .qt .est{color:#a9b4c8}
body.dark .blk-h{background:#16233c}
body.dark .blk-sum{background:#202c42}
body.dark .blk-sum b{color:#9db7e0}
body.dark .card h3{color:#9db7e0}
body.dark .note{background:#2b2612;border-color:#fbc02d}
body.dark .formula{background:#0b1526;border:1px solid #22304a}
body.dark .feed .fi{background:#202c42}
body.dark .modal{background:#1c2536;color:#e8ecf5}
body.dark .field label{color:#a9b4c8}
body.dark .bar{background:#202c42}
body.dark .btn.gray{background:#243044;color:#cfe3ff}
body.dark .heat div[style*="dfe6f2"]{background:#243044!important}
body.dark .kpi .v{color:#cfe3ff}
body.dark .mini{color:#7d8aa3}
/* ======== ПРЕЗЕНТАЦИЯ (этап 7) ======== */
.slide{background:#fff;border:1px solid #d5dcea;border-radius:12px;max-width:980px;margin:0 auto;padding:26px 32px;min-height:430px;position:relative;box-shadow:0 4px 14px rgba(15,30,60,.10)}
.slide,.slide *{color:#20242c}
.slide h1,.slide h2{color:#1f3864}
.slide h2{border-bottom:3px solid #2e74b5;padding-bottom:6px;margin:0 0 12px;font-size:21px}
.slide h3{color:#2e5395;margin:10px 0 6px;font-size:14.5px}
.slide .snum{position:absolute;top:12px;right:16px;color:#8c8c8c;font-size:11.5px}
.slide table{width:100%;border-collapse:collapse;font-size:12.5px;margin:6px 0}
.slide th{background:#eef2f9;color:#1f3864;border:1px solid #d5dcea;padding:5px 8px;text-align:left;font-size:12px}
.slide td{border:1px solid #d5dcea;padding:5px 8px;vertical-align:top}
.slide .band{margin-top:12px;padding:8px 12px;border-radius:8px;font-size:12.5px;line-height:1.45}
.slide .band.q{background:#fff8e1;border:1px solid #f0c93a}
.slide .band.rule{background:#eef4fb;border:1px solid #9db7e0}
.slide .band.disc{background:#fdecea;border:1px solid #e57373}
.slide .badge{display:inline-block;background:#1f3864;border-radius:10px;padding:8px 16px;font-weight:800;font-size:16px}
.slide .badge,.slide .badge *{color:#fff}
.slide .pill{color:#fff}
.slide .catline{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.slide .catline span{border-radius:8px;padding:5px 9px;font-size:11.5px;font-weight:700;color:#fff}
.slide .mini{color:#6b7280}
.slide .cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.slide .kv{font-size:12.5px;line-height:1.6}
.slide .kv b{color:#1f3864}
@media print{.slide{page-break-after:always;box-shadow:none;border:none;max-width:none;border-radius:0;min-height:0}}
@media print{
  .topbar,.tabs,#toasts,#moverlay,.noprint{display:none!important}
  main{padding:0}section.tab{display:none!important}section.tab#printarea{display:block!important}
  body{background:#fff}
  .card{box-shadow:none;border:1px solid #bbb}
}
</style>
</head>
<body>
<div class="topbar">
  <div class="logo">НК</div>
  <h1>Аудит НИОКР · интерактивная модель оценки</h1>
  <span class="ver">v13.0 · этап 13</span>
  <div class="spacer"></div>
  <label style="font-size:12px">НИОКР:
    <select id="selRnd" style="min-width:220px"></select>
  </label>
  <button class="btn ghost sm" id="btnAdd">＋ НИОКР</button>

  <label style="font-size:12px">Роль:
    <select id="selRole" aria-label="Роль пользователя">
      <option value="auditor">Аудитор</option>
      <option value="dept">Подразделение</option>

      <option value="exp">Техэксперт</option>
      <option value="view">Наблюдатель</option>
    </select>

  <button class="btn ghost sm" id="btnTheme" title="Переключить тему (клавиша t)" aria-label="Переключить тему">🌙</button>

  <button class="btn sm" id="btnSave">Сохранить</button>

<div class="tabs" id="tabs">

  <button data-t="anal">📈 Аналитика</button>
  <button data-t="wgt">⚖️ Веса (AHP)</button>

  <button data-t="port">🗂 Портфель</button>
  <button data-t="flow">🔄 Маршрут</button>
  <button data-t="resp">👥 Респонденты</button>
  <button data-t="db">🗄 База НИОКР</button>
  <button data-t="viz">📉 Графики БД</button>
  <button data-t="prop">🎯 Предложения</button>
  <button data-t="ref">📚 Справочник</button>
  <button data-t="rep">🖨 Акт оценки</button>
  <button data-t="pres">🎞 Презентация</button>
</div>
<main>
  <section class="tab on" id="tab-dash"></section>
  <section class="tab" id="tab-check"></section>
  <section class="tab" id="tab-evid"></section>
  <section class="tab" id="tab-anal"></section>
  <section class="tab" id="tab-wgt"></section>
  <section class="tab" id="tab-pass"></section>
  <section class="tab" id="tab-port"></section>
  <section class="tab" id="tab-flow"></section>
  <section class="tab" id="tab-resp"></section>
  <section class="tab" id="tab-db"></section>
  <section class="tab" id="tab-viz"></section>
  <section class="tab" id="tab-prop"></section>
  <section class="tab" id="tab-ref"></section>
  <section class="tab" id="tab-rep"></section>
  <section class="tab" id="tab-pres"></section>
  <section class="tab" id="printarea"></section>
</main>
<div id="toasts"></div>
<div id="moverlay"><div class="modal" id="mbox"></div></div>

<script>
"use strict";
/* ================= ДАННЫЕ МЕТОДИКИ (чек-лист v2.0, 27 вопросов) ================= */
const W=[30,35,35];
const BNAME=["I. Актуальность","II. Эффективность","III. Целесообразность"];
const BGOAL=["сохраняет ли НИОКР научно-техническую, производственную и практическую ценность",
"насколько результаты соответствуют вложенным финансовым, трудовым и материальным ресурсам",
"что организации выгоднее сделать с результатами НИОКР"];
const QS=[
["Сохраняется ли потребность организации в результате НИОКР?","Есть ли действующая или перспективная потребность заказчика, подразделений и конечных пользователей?",0],
["Соответствует ли НИОКР текущим и перспективным задачам организации?","Связана ли разработка со стратегией развития, техническим перевооружением и перспективными программами?",0],
["Не устарел ли научно-технический результат?","Не появились ли новые технологии, компоненты, алгоритмы, делающие результат морально устаревшим?",0],
["Сохраняет ли результат научно-техническую новизну?","Существует ли оригинальное решение, преимущество или уникальная компетенция? Не дублирует ли другие разработки?",0],
["Соответствует ли результат действующим нормативным требованиям?","Проверено ли соответствие актуальным ГОСТ, ОСТ, техрегламентам, требованиям безопасности?",0],
["Сохраняет ли результат конкурентоспособность и технологическую значимость?","Не появились ли более эффективные отечественные или зарубежные аналоги?",0],
["Решает ли НИОКР актуальную задачу или продолжается в силу ранее принятых обязательств? ★","Подтверждена ли разработка текущим запросом потребителя? Нет ли продолжения «по инерции» и «эффекту невозвратных затрат»?",0],
["Если запустить эту НИОКР заново сегодня — организация снова приняла бы такое решение? ★","Тест «нового старта»: ожидаемый эффект против объёма новых вложений; альтернативные приоритетные проекты.",0],
["Подтверждена ли оценка актуальности объективными внешними данными? ★","Свежесть и полнота анализа рынка, патентного поиска, прогноза направления; не только мнение исполнителя.",0],
["Достигнуты ли цели и результаты, установленные ТЗ?","Сопоставлены ли фактические результаты с ТЗ, календарным планом и программой испытаний?",1],
["Соблюдены ли установленные сроки выполнения НИОКР?","Фактические отклонения от плановых сроков и их причины.",1],
["Соблюдён ли утверждённый бюджет НИОКР?","Плановые и фактические расходы, причины отклонений, допфинансирование.",1],
["Рационально ли использованы трудовые и материальные ресурсы?","Трудозатраты, загрузка исполнителей, закупки против достигнутых результатов.",1],
["Достигнут ли запланированный научно-технический уровень?","Характеристики подтверждены расчётами, моделированием, испытаниями, сравнением с аналогами?",1],
["Сформирован ли реальный научно-технический задел?","РКД, ПО, технологии, методики, прототипы, РИД — повторно используемые результаты.",1],
["Все ли затраты связаны с результатом; нет ли повторных оплат? ★","Структура затрат: непрофильные расходы, двойные закрытия этапов, полнота первичных документов.",1],
["Учтены ли и используются ли закупленные, но не использованные ресурсы? ★","Остатки ТМЦ, простаивающее оборудование, возможность применения в других работах.",1],
["Обоснована ли оставшаяся потребность в финансировании до завершения? ★","Смета оставшихся работ, прогноз итоговой стоимости, риски роста затрат.",1],
["Имеется ли реальная возможность практического внедрения результата?","Мощности, технологии, комплектующие, персонал, инфраструктура для освоения.",2],
["Имеется ли конкретный заказчик или потребитель результата?","Подразделение-потребитель, заказчик, объём потребности, сроки внедрения.",2],
["Оправданы ли дальнейшие вложения в НИОКР?","Ожидаемый эффект против оставшихся затрат и рисков.",2],
["Выгоднее ли продолжение собственной разработки альтернативам?","Сравнение: своя разработка / покупка / лицензирование / сторонний исполнитель.",2],
["Обеспечена ли готовность результата к внедрению и освоению производства?","Технологическая зрелость, документация, этапы испытаний и освоения.",2],
["Определены ли дальнейшие действия и ответственные за внедрение?","Утверждённый план продолжения, модернизации, передачи, приостановки или прекращения.",2],
["Оценён ли полный объём вложений до реально используемого результата? ★","Включая подготовку производства, обучение, сертификацию, инфраструктуру.",2],
["Обеспечены ли правовая охрана результатов и свобода их использования? ★","РИД, права соисполнителей, обременения третьих лиц, защита ноу-хау.",2],
["Установлены ли измеримые показатели эффекта, ответственные и сроки внедрения? ★","План внедрения с KPI, персональными ответственными, сроками, источниками финансирования.",2]
];
const ANS=[["5","Да, полностью"],["4","В основном да"],["3","Частично"],["1","Скорее нет"],["0","Нет"],["НП","Н/П"]];

const RCOLOR=["#2e74b5","#1f9d55","#c62828","#7b1fa2","#ef6c00","#00838f","#5d4037","#455a64"];
const respOn=r=>!!(r.resp&&r.resp.enabled);
function respInit(r){if(!r.resp)r.resp={enabled:false,cur:"",seq:0,people:[],data:{}};
 if(!r.resp.people)r.resp.people=[];if(!r.resp.data)r.resp.data={};return r.resp;}
function addResp(r,name,title){const R=respInit(r);R.seq=(R.seq||0)+1;const id="p"+R.seq;
 R.people.push({id,name:name||("Респондент "+R.people.length+1),title:title||"",color:RCOLOR[R.people.length%RCOLOR.length]});
 R.data[id]={ans:Array(27).fill(""),conf:Array(27).fill(""),com:Array(27).fill("")};
 if(!R.cur)R.cur=id;return id;}
const actResp=r=>{if(!respOn(r))return null;return r.resp.data[r.resp.cur]||null;};
const actPerson=r=>{if(!respOn(r))return null;return r.resp.people.find(p=>p.id===r.resp.cur)||null;};
function ansArr(r){const a=actResp(r);return a?a.ans:r.ans;}
function confArr(r){const a=actResp(r);return a?a.conf:r.conf;}
function comArr(r){const a=actResp(r);return a?a.com:r.com;}
function med(nums){const s=nums.slice().sort((a,b)=>a-b),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2;}
function syncConsensus(r){
  if(!respOn(r))return;
  const P=r.resp.people.filter(p=>r.resp.data[p.id]),mode=state.respMode||"median";
  for(let i=0;i<27;i++){
    const nums=[];let np=0;
    P.forEach(p=>{const a=r.resp.data[p.id].ans[i];if(a==="НП")np++;else if(a!=="")nums.push(Number(a));});
    let v="";
    if(np>nums.length)v="НП";
    else if(nums.length)v=String(Math.round((mode==="mean"?nums.reduce((s,x)=>s+x,0)/nums.length:med(nums))*100)/100);
    r.ans[i]=v;
    const cs=P.map(p=>r.resp.data[p.id].conf[i]).filter(x=>x);
    const da=cs.filter(x=>x==="Да").length;r.conf[i]=(da>0&&da*2>=cs.length)?"Да":(cs.length?"Нет":"");
    const cms=P.map(p=>({n:p.name,c:(r.resp.data[p.id].com[i]||"").trim()})).filter(x=>x.c);
    r.com[i]=cms.map(x=>x.n+": "+x.c).join(" | ");
  }
}
function disagreementOf(r,all){
  if(!respOn(r))return[];
  const P=r.resp.people.filter(p=>r.resp.data[p.id]),out=[];
  for(let i=0;i<27;i++){
    const vals=P.map(p=>({name:p.name,color:p.color,a:r.resp.data[p.id].ans[i]}));
    if(!all&&!vals.some(v=>v.a!==""))continue;
    const nums=vals.filter(v=>v.a!==""&&v.a!=="НП").map(v=>Number(v.a));
    const np=vals.filter(v=>v.a==="НП").length;
    const spread=nums.length?Math.max.apply(null,nums)-Math.min.apply(null,nums):0;
    const mixed=np>0&&nums.length>0;
    if(all||spread>0||mixed)
      out.push({i,vals,spread,mixed,med:nums.length?med(nums):null,mean:nums.length?nums.reduce((s,x)=>s+x,0)/nums.length:null,cons:r.ans[i],np});
  }
  return out.sort((a,b)=>b.spread-a.spread);
}
function respStats(r){
  const P=(r.resp?r.resp.people:[]).filter(p=>r.resp.data[p.id]);
  const rows=P.map(p=>{const dd=r.resp.data[p.id];const cc=calcCore(dd.ans,state.weights);
    return{p,filled:dd.ans.filter(a=>a!=="").length,I:cc.I};});
  return{n:P.length,rows,dis:disagreementOf(r),cI:calc(r).I,mode:state.respMode||"median"};
}

  for(let i=0;i<27;i++)csv+=[i+1,esc(QS[i][0]),"КОНСЕНСУС ("+(state.respMode==="mean"?"среднее":"медиана")+")",r.ans[i]==="НП"?"Н/П":r.ans[i],r.conf[i],esc(r.com[i])].join(";")+"\n";
  return csv;
}

function dbStats(){

  L.forEach(r=>{const c=calc(r);const cat=c.cat||"Не оценена";byCat[cat]=(byCat[cat]||0)+1;
    const f=formOf(r),fk=f?f.name:"— не указана —";byForm[fk]=(byForm[fk]||0)+1;

function calcCore(ans,Wv){
  Wv=Wv||W;
  const bl=[0,1,2].map(b=>{let S=0,N=0;
    for(let i=0;i<27;i++){if(QS[i][2]!==b)continue;const a=ans[i];if(a===""||a==="НП")continue;S+=Number(a);N++;}
    const P=N?S/(5*N):null;return{S,N,P,B:P==null?0:Wv[b]*P,Wapp:P==null?0:Wv[b]};});
  const Wsum=bl.reduce((s,x)=>s+x.Wapp,0),Bsum=bl.reduce((s,x)=>s+x.B,0);
  const I=Wsum?100*Bsum/Wsum:null;
  let cat=null,rec=null,col="#9e9e9e";
  if(I!=null){for(const c of CATS){if(I>=c[0]){cat=c[1];rec=c[3];col=c[2];break;}}}
  return{bl,I,cat,rec,col,Wsum,renorm:Wsum>0&&Wsum<100};
}
function calc(r){
  const c=calcCore(r.ans,state.weights);
  c.nCtrl=r.ctrl.filter(x=>x==="Выявлено").length;
  return c;
}

function polar(cx,cy,r,a){const x=cx+r*Math.cos(a),y=cy+r*Math.sin(a);return[x,y];}
function arc(cx,cy,r,a0,a1){const[p0,p1]=[polar(cx,cy,r,a0),polar(cx,cy,r,a1)];
  return"M"+p0[0]+" "+p0[1]+" A"+r+" "+r+" 0 "+((a1-a0)>Math.PI?1:0)+" 1 "+p1[0]+" "+p1[1];}
function gauge(I){
  const cx=110,cy=105,r=86;let s='<svg viewBox="0 0 220 125" width="240">';
  const zones=[[0,30,"#c62828"],[30,50,"#ef6c00"],[50,70,"#fbc02d"],[70,85,"#7cb342"],[85,100,"#2e7d32"]];
  for(const z of zones){const a0=Math.PI+(z[0]/100)*Math.PI,a1=Math.PI+(z[1]/100)*Math.PI;
    s+='<path d="'+arc(cx,cy,r,a0,a1)+'" stroke="'+z[2]+'" stroke-width="16" fill="none" stroke-linecap="butt"/>';}
  if(I!=null){const a=Math.PI+(I/100)*MathPIfix();const[p]= [polar(cx,cy,r-24,a)];
    s+='<line x1="'+cx+'" y1="'+cy+'" x2="'+p[0]+'" y2="'+p[1]+'" stroke="#1f3864" stroke-width="4" stroke-linecap="round"/>';
    s+='<circle cx="'+cx+'" cy="'+cy+'" r="6" fill="#1f3864"/>';
    s+='<text x="'+cx+'" y="'+(cy-14)+'" text-anchor="middle" font-size="26" font-weight="800" fill="#1f3864">'+I.toFixed(1)+'</text>';}
  else{s+='<text x="'+cx+'" y="'+(cy-14)+'" text-anchor="middle" font-size="15" font-weight="700" fill="#9e9e9e">Н/П</text>';}
  s+='<text x="14" y="120" font-size="10" fill="#8c8c8c">0</text><text x="196" y="120" font-size="10" fill="#8c8c8c">100</text></svg>';
  return s;
}
function MathPIfix(){return Math.PI;}
function radar(bl){
  const cx=110,cy=100,R=78;let s='<svg viewBox="0 0 220 200" width="250">';
  const ang=[-Math.PI/2,Math.PI/2+Math.PI/6*5,Math.PI/2+Math.PI/6];
  for(const g of[0.33,0.66,1]){s+='<polygon points="'+ang.map(a=>{const[x,y]=polar(cx,cy,R*g,a);return x+","+y;}).join(" ")+'" fill="none" stroke="#dfe6f2"/>';}
  ang.forEach(a=>{const[x,y]=polar(cx,cy,R,a);s+='<line x1="'+cx+'" y1="'+cy+'" x2="'+x+'" y2="'+y+'" stroke="#dfe6f2"/>';});
  const pts=ang.map((a,i)=>{const v=bl[i].P==null?0:bl[i].P;const[x,y]=polar(cx,cy,R*v,a);return x+","+y;}).join(" ");
  s+='<polygon points="'+pts+'" fill="rgba(46,116,181,.30)" stroke="#2e74b5" stroke-width="2"/>';

  return s+'</svg>';
}

function setAns(i,v){
  const r=cur();const A=ansArr(r),M=comArr(r);const oldA=A[i];A[i]=v;
  if(oldA!==v)logEvent(r,"чек-лист: вопрос "+(i+1)+(respOn(r)?" ("+(actPerson(r)||{name:"—"}).name+")":"")+" ответ "+(oldA==="НП"?"«Н/П»":(oldA||"—"))+" → "+(v==="НП"?"«Н/П»":(v||"—")));
  if(respOn(r))syncConsensus(r);
  if(v==="НП"&&!(M[i]||"").trim()){
    showModal('<h2>Обоснование ответа «Н/П» — вопрос '+(i+1)+'</h2><p>Ответ «Н/П» исключает вопрос из числителя и знаменателя расчёта блока. Укажите причину неприменимости (обязательно):</p><textarea id="npTxt" rows="3" style="width:100%"></textarea>',
    [{label:"Отмена",cls:"gray",fn:()=>{A[i]="";if(respOn(r))syncConsensus(r);renderCheck();renderDash();}},{label:"Сохранить обоснование",fn:()=>{M[i]=document.getElementById("npTxt").value||"Н/П без пояснения";if(respOn(r))syncConsensus(r);notify("warn","Вопрос "+(i+1)+" исключён из расчёта","«Н/П»: "+M[i]);afterChange();}}]);
  }else if((v==="4"||v==="5")&&confArr(r)[i]==="Нет"){
    ruleWarn(i);
  }else if(v!==""){notify("ok","Вопрос "+(i+1)+" оценён","Ответ: "+ANS.find(x=>x[0]===v)[1]+(respOn(r)?" · консенсус: "+(r.ans[i]==="НП"?"Н/П":(r.ans[i]||"—")):"")+" → "+(v==="НП"?"исключён":v+" балл(ов)"));afterChange();}

function setConf(i,v){

const DOCTYPES=["ТЗ / техзадание","Договор / госконтракт","Отчёт о НИР/ОКР (этапный)","Отчёт годовой","Протокол испытаний","Акт приёмки этапа","Акт внедрения","РКД / КД","Патент / св-во (РИД)","Финансовый документ","Приказ / распоряжение","Служебная переписка","Заключение экспертизы","Презентационные материалы","Другое"];
const DOCSTATUS=[["provided","Предоставлен"],["declared","Заявлен"],["requested","Запрошен"],["absent","Отсутствует"]];
const DSCOL={provided:"#2e7d32",declared:"#b8860b",requested:"#2e74b5",absent:"#c62828"};
function docStatusLbl(s){const x=DOCSTATUS.find(y=>y[0]===s);return x?x[1]:s;}
function fmtDate(iso){return(iso&&iso.length===10)?iso.split("-").reverse().join("."):(iso||"—");}
function evidStats(r){
 const docs=r.docs||[];
 const hasProv=i=>docs.some(d=>d.q===i&&d.status==="provided");
 const scored=[],high=[],viol=[];
 for(let i=0;i<27;i++){const a=r.ans[i];if(a===""||a==="НП")continue;scored.push(i);
  if(a==="4"||a==="5"||(isFinite(Number(a))&&Number(a)>=4)){high.push(i);if(!hasProv(i))viol.push(i);}}
 const D=scored.length?100*scored.filter(hasProv).length/scored.length:null;
 const K=high.length?100*high.filter(hasProv).length/high.length:null;
 return{docs,hasProv,scored,high,viol,D,K,total:docs.length,
  prov:docs.filter(d=>d.status==="provided").length,
  decl:docs.filter(d=>d.status==="declared").length,
  req:docs.filter(d=>d.status==="requested").length,
  abs:docs.filter(d=>d.status==="absent").length};
}
function syncConfFromDocs(r,i){
 const hasProv=(r.docs||[]).some(d=>d.q===i&&d.status==="provided");
 const C=confArr(r);
 if(hasProv&&C[i]!=="Да"){C[i]="Да";if(respOn(r))syncConsensus(r);notify("info","Подтверждение обновлено автоматически","вопрос "+(i+1)+": в реестре есть предоставленный документ");}
}

 if(highScore&&!hasProv)h+='<div class="note">⚠️ Высокий балл ('+a+') без предоставленного документа — нарушение правила методики. Добавьте документ со статусом «Предоставлен» или снизьте балл.</div>';
 if(highScore&&hasProv)h+='<div class="note" style="background:#f2f8ee;border-color:#7cb342">✓ Правило «4–5 только с документом» соблюдено.</div>';
 h+=docs.length?'<table><tr><th>Наименование и реквизиты</th><th>Тип</th><th>Дата</th><th>Статус</th><th>Примечание</th><th></th></tr>'+

 h+='<div style="margin-top:10px" class="noprint"><button class="btn sm" id="docAdd">＋ Добавить документ</button></div>';
 showModal(h,

function buildDocsCsv(r){
 const st=evidStats(r);
 let csv="Вопрос №;Вопрос;Документ;Тип;Дата;Статус;Примечание\n";
 (r.docs||[]).slice().sort((a,b)=>a.q-b.q).forEach(dc=>{
  csv+=[dc.q>=0?dc.q+1:"",dc.q>=0?QS[dc.q][0]:"Общий по НИОКР",dc.name||"",dc.type,fmtDate(dc.date),docStatusLbl(dc.status),dc.note||""].map(x=>String(x).replace(/;/g,",")).join(";")+"\n";});
 csv+="\nПоказатель;Значение\n";
 csv+="Всего документов;"+st.total+"\nПредоставлено;"+st.prov+"\n";
 csv+="Доказательная зрелость D;"+(st.D==null?"":st.D.toFixed(1)+"%")+"\n";
 csv+="Соблюдение правила 4-5 K;"+(st.K==null?"":st.K.toFixed(1)+"%")+"\n";

 return csv;

 let h='<div class="grid g4">'+
 '<div class="card kpi"><span class="l">ДОКАЗАТЕЛЬНАЯ ЗРЕЛОСТЬ D</span><span class="v" style="color:'+dCol+'">'+(st.D==null?"Н/П":st.D.toFixed(0)+" %")+'</span><span class="l">оценённых вопросов с предоставленными документами: '+scoredProv+' из '+st.scored.length+'</span></div>'+
 '<div class="card kpi"><span class="l">ПРАВИЛО «4–5 ТОЛЬКО С ДОКУМЕНТОМ» K</span><span class="v" style="color:'+kCol+'">'+(st.K==null?"Н/П":st.K.toFixed(0)+" %")+'</span><span class="l">высоких баллов с подтверждением: '+highProv+' из '+st.high.length+'</span></div>'+
 '<div class="card kpi"><span class="l">ДОКУМЕНТОВ В РЕЕСТРЕ</span><span class="v">'+st.total+'</span><span class="l">предоставлено '+st.prov+' · заявлено '+st.decl+' · запрошено '+st.req+' · отсутствует '+st.abs+'</span></div>'+
 '<div class="card kpi"><span class="l">НАРУШЕНИЯ (4–5 БЕЗ ДОКУМЕНТА)</span><span class="v" style="color:'+(st.viol.length?"#c62828":"#2e7d32")+'">'+st.viol.length+'</span><span class="l">'+(st.viol.length?"вопросы: "+st.viol.map(i=>i+1).join(", "):"правило соблюдено по всем высоким баллам")+'</span></div></div>';
 const blkRows=[0,1,2].map(b=>{const sb=st.scored.filter(i=>QS[i][2]===b),hb=st.high.filter(i=>QS[i][2]===b);
  const sp=sb.filter(st.hasProv).length,hp=hb.filter(st.hasProv).length;
  return'<tr><td>'+BNAME[b]+'</td><td>'+sb.length+'</td><td>'+sp+'</td><td>'+(sb.length?(100*sp/sb.length).toFixed(0)+" %":"—")+'</td><td>'+hb.length+'</td><td>'+hp+'</td><td>'+(hb.length?(100*hp/hb.length).toFixed(0)+" %":"—")+'</td></tr>';}).join("");
 h+='<div class="grid g2" style="margin-top:14px"><div class="card"><h3>Зрелость доказательств по блокам</h3><table><tr><th>Блок</th><th>Оценено</th><th>С док.</th><th>D</th><th>Баллы 4–5</th><th>С док.</th><th>K</th></tr>'+blkRows+'</table><div class="mini" style="margin-top:6px">D — доля оценённых вопросов блока с предоставленными документами; K — доля высоких баллов (4–5), подтверждённых предоставленными документами. Статус «Предоставлен» автоматически включает подтверждение вопроса.</div></div>';
 h+='<div class="card"><h3>⚠️ Высокие баллы без доказательств</h3>'+(st.viol.length?'<div class="feed">'+st.viol.map(i=>'<div class="fi warn">Вопрос <b>'+(i+1)+'</b> — балл '+r.ans[i]+': '+QS[i][0].slice(0,64)+(QS[i][0].length>64?"…":"")+' <button class="btn sm gray" data-goq="'+i+'">→ к вопросу</button></div>').join("")+'</div>':'<div class="note" style="background:#f2f8ee;border-color:#7cb342">✓ Нарушений нет: каждый балл 4–5 подтверждён предоставленным документом.</div>')+'</div></div>';
 h+='<div class="card" style="margin-top:14px"><h3>Реестр документов</h3>'+
 '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px" class="noprint">'+
 '<label style="font-size:12px">Блок: <select id="evBlk"><option value="all"'+(f.blk==="all"?" selected":"")+'>все</option><option value="0"'+(f.blk==="0"?" selected":"")+'>I Актуальность</option><option value="1"'+(f.blk==="1"?" selected":"")+'>II Эффективность</option><option value="2"'+(f.blk==="2"?" selected":"")+'>III Целесообразность</option><option value="gen"'+(f.blk==="gen"?" selected":"")+'>общие</option></select></label>'+
 '<label style="font-size:12px">Тип: <select id="evType"><option value="">все</option>'+DOCTYPES.map(t=>'<option'+(f.type===t?" selected":"")+'>'+t+'</option>').join("")+'</select></label>'+
 '<label style="font-size:12px">Статус: <select id="evStatus"><option value="">все</option>'+DOCSTATUS.map(s=>'<option value="'+s[0]+'"'+(f.status===s[0]?" selected":"")+'>'+s[1]+'</option>').join("")+'</select></label>'+
 '<input type="text" id="evSearch" placeholder="🔎 поиск по реестру…" value="'+(f.search||"").replace(/"/g,"&quot;")+'" style="flex:1;min-width:150px"></div>'+
 (idxDocs.length?'<table><tr><th>Вопрос</th><th>Наименование документа</th><th>Тип</th><th>Дата</th><th>Статус</th><th>Примечание</th><th></th></tr>'+
  idxDocs.map(x=>{const dc=x.dc;
   return'<tr><td>'+(dc.q===-1?'<span class="mini">общий</span>':'<b>№'+(dc.q+1)+'</b> <button class="btn sm gray" data-goq="'+dc.q+'" title="К вопросу чек-листа">→</button><br><span class="mini">'+QS[dc.q][0].slice(0,44)+(QS[dc.q][0].length>44?"…":"")+'</span>')+'</td>'+
   '<td>'+(dc.name||'<span class="mini">— не заполнено —</span>')+'</td><td style="font-size:12px">'+dc.type+'</td><td>'+fmtDate(dc.date)+'</td>'+
   '<td><span class="pill" style="background:'+DSCOL[dc.status]+'">'+docStatusLbl(dc.status)+'</span></td><td class="mini">'+(dc.note||"")+'</td>'+
   '<td class="noprint"><button class="btn sm warn" data-edel="'+x.gi+'">✕</button></td></tr>';}).join("")+'</table>'
  :'<div class="mini">Документов по текущему фильтру нет.</div>')+
 '<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap" class="noprint"><select id="evNewQ" style="min-width:280px"><option value="-1">Общий документ (вся НИОКР)</option>'+QS.map((qq,i)=>'<option value="'+i+'">Вопрос '+(i+1)+': '+qq[0].slice(0,50)+(qq[0].length>50?"…":"")+'</option>').join("")+'</select><button class="btn sm" id="evAdd">＋ Добавить документ</button> <button class="btn gray sm" id="evCsv">Экспорт CSV</button> <button class="btn gray sm" id="evPrint">🖨 Печать реестра</button></div></div>';
 document.getElementById("tab-evid").innerHTML=h;
 document.getElementById("evBlk").onchange=e=>{f.blk=e.target.value;renderEvid();};
 document.getElementById("evType").onchange=e=>{f.type=e.target.value;renderEvid();};
 document.getElementById("evStatus").onchange=e=>{f.status=e.target.value;renderEvid();};
 document.getElementById("evSearch").oninput=e=>{f.search=e.target.value;state.evidFocus=true;renderEvid();};
 if(state.evidFocus){const s2=document.getElementById("evSearch");s2.focus();s2.setSelectionRange(s2.value.length,s2.value.length);state.evidFocus=false;}
 document.querySelectorAll("#tab-evid [data-goq]").forEach(b=>b.onclick=e=>gotoQ(+e.target.closest("[data-goq]").dataset.goq));
 document.querySelectorAll("#tab-evid [data-edel]").forEach(b=>b.onclick=e=>{const gi=+e.target.dataset.edel;const dc=r.docs[gi];
  showModal('<h2>Удалить документ из реестра?</h2><p><b>'+(dc.name||"(без наименования)")+'</b> — вопрос '+(dc.q>=0?dc.q+1:"общий")+'</p>',
  [{label:"Отмена",cls:"gray"},{label:"Удалить",cls:"warn",fn:()=>{r.docs.splice(gi,1);save();renderEvid();renderCheck();
   notify("warn","Документ удалён из реестра","вопрос "+(dc.q>=0?dc.q+1:"общий"));}}]);});
 document.getElementById("evAdd").onclick=()=>{const qv=parseInt(document.getElementById("evNewQ").value);
  r.docs.push({q:qv,name:"",type:DOCTYPES[0],date:"",status:"declared",note:""});save();renderEvid();renderCheck();
  notify("ok","Документ добавлен в реестр",(qv>=0?"вопрос "+(qv+1):"общий документ")+" — заполните наименование, дату и статус");};
 document.getElementById("evCsv").onclick=()=>{download("Реестр_доказательств_"+r.shifr+".csv",buildDocsCsv(r),"text/csv");
  notify("ok","Реестр доказательств экспортирован","CSV: "+st.total+" док., D = "+(st.D==null?"Н/П":st.D.toFixed(1)+"%"));}
 ;document.getElementById("evPrint").onclick=printEvidAkt;
 if(!canPass()){
  document.querySelectorAll("#tab-evid select,#tab-evid input,#tab-evid button").forEach(el=>{if(!el.dataset||!el.dataset.goq)el.disabled=true;});
  document.getElementById("tab-evid").insertAdjacentHTML("afterbegin",'<div class="note">🔒 Роль «Наблюдатель»: реестр доказательств доступен только для чтения.</div>');
 }
 updateEvidBadge();

  '<div class="field"><label>Форма проведения НИОКР</label><select data-p="form"><option value="">— не указана —</option>'+FORMS.map(f=>'<option value="'+f.id+'"'+(r.form===f.id?" selected":"")+'>'+f.name+'</option>').join("")+'</select></div>'+
  '<div class="field"><label>Руководитель НИОКР</label>'+f("head","должность, ФИО")+'</div>'+
  '<div class="field"><label>Краткая цель</label>'+f("goal","какую проблему решает")+'</div>'+

  '<div class="field"><label>Прогнозная итоговая стоимость</label><input type="text" readonly value="'+progTotal(r)+'" style="width:100%;background:#f2f2f2"></div>'+

  }else if(flowOf(r)){

    document.querySelectorAll("#tab-pass [data-p]").forEach(el=>{if(!allowP(r,el.dataset.p)){el.disabled=true;locked++;}});
    document.querySelectorAll("#tab-pass [data-k]").forEach(el=>{if(state.role!=="auditor"){el.disabled=true;locked++;}});
    if(locked)document.getElementById("tab-pass").insertAdjacentHTML("afterbegin",'<div class="note">🔒 Маршрут согласования: этап '+f.stage+' «'+FLOW[f.stage-1].name+'» ('+((FST[f.stages[f.stage-1].status]||FST.wait)[0])+'). '+({dept:"Подразделение редактирует данные только на этапе 1.",fin:"Финансы редактируют финансовый блок (план/факт/прогноз) на этапе 2.",exp:"Техэксперты работают с тредами комментариев на вкладке «🔄 Маршрут».",auditor:"Аудитор: полный доступ на любом этапе."}[state.role]||"")+' Поля вне вашего этапа заблокированы ('+locked+' шт.).</div>');
  }
}
function finRow(k,lbl,r){return'<div class="field"><label>'+lbl+'</label><input type="number" step="0.01" data-p="fin.'+k+'" value="'+(r.fin[k]||"")+'" style="width:100%"></div>';}
function progTotal(r){const a=parseFloat(r.fin.fact),b=parseFloat(r.fin.prog);return(isFinite(a)&&isFinite(b))?(a+b).toFixed(2):"—";}
function devPct(r){const p=parseFloat(r.fin.plan),t=parseFloat(progTotal(r));return(isFinite(p)&&p&&isFinite(t))?((t/p-1)*100).toFixed(1)+" %":"—";}

  const avg=state.list.map(r=>calc(r).I).filter(x=>x!=null);

  '<div class="grid g3"><div class="card"><h3>Распределение по категориям</h3>'+donut(state.list)+'</div>'+
  '<div class="card kpi"><span class="l">НИОКР в портфеле</span><span class="v">'+state.list.length+'</span><span class="l">выполняется: '+state.list.filter(r=>r.status==="Выполняется").length+' · приостановлено: '+state.list.filter(r=>r.status==="Приостановлена").length+'</span></div>'+
  '<div class="card kpi"><span class="l">СРЕДНИЙ ИНТЕГРАЛЬНЫЙ БАЛЛ</span><span class="v">'+(avg.length?(avg.reduce((a,b)=>a+b,0)/avg.length).toFixed(1):"—")+'</span><span class="l">кандидаты на прекращение (I&lt;50): '+state.list.filter(r=>{const c=calc(r);return c.I!=null&&c.I<50;}).length+'</span></div></div>'+
  '<div class="card" style="margin-top:14px"><h3>Сводная матрица портфеля</h3>'+
  '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px" class="noprint"><label style="font-size:12px">Форма НИОКР: <select id="pfForm"><option value="">все</option>'+FORMS.map(f=>'<option value="'+f.id+'"'+(state.portForm===f.id?" selected":"")+'>'+f.name+'</option>').join("")+'</select></label><span class="mini">показано '+vis.length+' из '+state.list.length+(vis.length?' · средний I (показанных): '+(()=>{const a=vis.map(i=>calc(state.list[i]).I).filter(x=>x!=null);return a.length?(a.reduce((x,y)=>x+y,0)/a.length).toFixed(1):"—";})():"")+'</span></div>'+
  '<table><tr><th>№</th><th>Шифр / наименование</th><th>Статус</th><th>Форма</th><th>Маршрут</th><th>Респ.</th><th>Стоимость, млн ₽</th><th>Готовность</th><th>I</th><th>Категория</th><th>Управленческое решение</th><th></th></tr>'+rows+'</table>'+
  '<div style="margin-top:10px" class="noprint"><button class="btn" id="pAdd">＋ Добавить НИОКР</button> <button class="btn gray" id="pCsv">Экспорт CSV</button></div></div>';
  document.querySelectorAll("#tab-port select[data-d]").forEach(el=>el.onchange=e=>{state.list[+e.target.dataset.d].decision=e.target.value;save();notify("ok","Решение зафиксировано",state.list[+e.target.dataset.d].shifr+": "+e.target.value);});
  document.querySelectorAll("#tab-port [data-open]").forEach(el=>el.onclick=e=>{state.cur=+e.target.dataset.open;save();renderSel();goTab("dash");});
  document.querySelectorAll("#tab-port [data-del]").forEach(el=>el.onclick=e=>{const i=+e.target.dataset.del;
    showModal('<h2>Удалить НИОКР из портфеля?</h2><p><b>'+state.list[i].shifr+' — '+state.list[i].name+'</b> будет удалена вместе с ответами чек-листа.</p>',
    [{label:"Отмена",cls:"gray"},{label:"Удалить",cls:"warn",fn:()=>{state.list.splice(i,1);if(state.cur>=state.list.length)state.cur=0;if(!state.list.length)state.list.push(newRnd());save();renderAll();notify("warn","НИОКР удалена из портфеля","");}}]);});
  const pa=document.getElementById("pAdd");if(pa){pa.onclick=addRnd;if(!canPort())pa.disabled=true;}
  const pf=document.getElementById("pfForm");if(pf)pf.onchange=e=>{state.portForm=e.target.value;renderPort();};
  const pc=document.getElementById("pCsv");if(pc)pc.onclick=exportCsv;
  if(!canPort()){
    document.querySelectorAll("#tab-port select[data-d],#tab-port [data-del],#tab-port [data-open]").forEach(el=>el.disabled=true);
  }
}
function exportCsv(){
  let csv="Шифр;Наименование;Форма;Маршрут;Респондентов;Статус;Стоимость;Готовность;I;Категория;Решение\n";
  state.list.forEach(r=>{const c=calc(r),F=formOf(r);csv+=[r.shifr,r.name,F?F.name:"",flowText(r),respOn(r)?r.resp.people.length:"",r.status,r.fin.plan||"",r.ready||"",c.I==null?"":c.I.toFixed(1),c.cat||"",r.decision||""].join(";")+"\n";});
  download("portfolio_niokr.csv",csv,"text/csv");notify("ok","CSV экспортирован","portfolio_niokr.csv");
}

const SCALEV=[0,1,3,4,5];
function mulberry(seed){let s=seed>>>0;return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function mcRun(r,N,seed){
  const rnd=mulberry(seed);
  const idx=[];for(let i=0;i<27;i++){const a=r.ans[i];if(a!==""&&a!=="НП")idx.push(i);}
  const out=[];
  for(let k=0;k<N;k++){
    const ans=r.ans.slice();
    for(const i of idx){
      const u=rnd(),p=SCALEV.indexOf(Number(r.ans[i]));
      if(u<0.15)ans[i]=String(SCALEV[Math.max(0,p-1)]);
      else if(u<0.30)ans[i]=String(SCALEV[Math.min(4,p+1)]);
    }
    out.push(calcCore(ans,state.weights).I);
  }
  return out;
}

function flowAct(a){
  const r=cur(),f=flowOf(r);if(!f||f.done)return;
  if(!canFlowAct(r)){notify("err","Действие недоступно",'этап «'+FLOW[f.stage-1].name+"» — роль "+ROLE_NAME[FLOW[f.stage-1].role]+"; аудитор может действовать на любом этапе");return;}
  const i=f.stage,s=f.stages[i-1],now=new Date().toLocaleString("ru-RU");
  if(a==="take"){s.status="work";s.by=whoAmI();s.date=now;logEvent(r,"маршрут: этап "+i+" «"+FLOW[i-1].name+"» взят в работу");save();renderFlow();renderDash();
    notify("info","Этап взят в работу",FLOW[i-1].icon+" "+FLOW[i-1].name+" · "+whoAmI());}
  else if(a==="ok"){s.status="ok";s.by=whoAmI();s.date=now;
    logEvent(r,"маршрут: этап "+i+" «"+FLOW[i-1].name+"» СОГЛАСОВАН");
    if(i<4){f.stage=i+1;f.since=new Date().toISOString();f.stages[i].status="work";
      logEvent(r,"маршрут: передано на этап "+(i+1)+" «"+FLOW[i].name+"» (роль "+ROLE_NAME[FLOW[i].role]+")");
      notify("ok","Этап «"+FLOW[i-1].name+"» согласован","передано: "+FLOW[i].icon+" "+FLOW[i].name+" — ответственный «"+ROLE_NAME[FLOW[i].role]+"»");}
    else{f.done=true;f.since="";logEvent(r,"маршрут ЗАВЕРШЁН — все 4 этапа согласованы");
      const au=saveAudit(r,"автофиксация: маршрут согласования завершён");
      notify("ok","Маршрут согласования завершён","НИОКР "+r.shifr+": все этапы пройдены — акт оценки может быть утверждён; аудит зафиксирован в БД (I="+(au.I==null?"Н/П":au.I.toFixed(1))+")");}
    save();renderAll();}
  else if(a==="back"){
    showModal('<h2>Вернуть с этапа «'+FLOW[i-1].name+'»?</h2><p>Комментарий с причиной возврата обязателен — он попадёт в журнал и будет виден ответственному.</p><textarea id="backTxt" rows="3" style="width:100%" placeholder="Причина возврата / что доработать"></textarea>',
    [{label:"Отмена",cls:"gray"},{label:"↩ Вернуть",cls:"warn",fn:()=>{const ta=document.getElementById("backTxt");const c=((ta&&ta.value)||"").trim();
      if(!c){notify("err","Комментарий обязателен","укажите причину возврата");return;}
      s.status="back";s.by=whoAmI();s.date=new Date().toLocaleString("ru-RU");s.comment=c;
      logEvent(r,"маршрут: ВОЗВРАТ с этапа "+i+" «"+FLOW[i-1].name+"» — «"+c.slice(0,80)+"»");
      if(i>1){f.stage=i-1;f.stages[i-2].status="work";f.since=new Date().toISOString();}
      save();renderAll();
      notify("warn","Возврат с этапа «"+FLOW[i-1].name+"»",(i>1?"этап "+(i-1)+" «"+FLOW[i-2].name+"» снова в работе":"доработка у подразделения")+" · «"+c.slice(0,50)+"»");}}]);}
}

    (list.length?list.map(t=>'<div class="card" style="margin:6px 0;padding:8px"><b>'+t.who+'</b> <span class="mini">'+t.t+'</span><div>'+String(t.text).replace(/</g,"&lt;")+'</div></div>').join(""):'<p class="mini">Комментариев пока нет — задайте вопрос исполнителю или зафиксируйте заключение.</p>')+

    :[{label:"Закрыть",cls:"gray"}]);};
  draw();
}

function dbVisible(){
  const db=state.db,q=(db.q||"").trim().toLowerCase();
  return state.list.map((r,i)=>i).filter(i=>{const r=state.list[i],c=calc(r);
    if(q){const hay=(r.shifr+" "+r.name+" "+(r.podrazd||"")+" "+(r.head||"")).toLowerCase();if(hay.indexOf(q)<0)return false;}
    if(db.form&&(r.form||"")!==db.form)return false;
    if(db.status&&(r.status||"")!==db.status)return false;
    if(db.cat&&(c.cat||"Не оценена")!==db.cat)return false;
    if(db.hasFlow&&!flowOf(r))return false;
    if(db.hasResp&&!respOn(r))return false;
    return true;});
}
function dbSortIdx(vis){
  const s=state.db.sort,L=state.list;
  const I=i=>{const c=calc(L[i]);return c.I==null?-1:c.I;};
  const arr=vis.slice();
  if(s==="name_asc")arr.sort((a,b)=>(L[a].name||"").localeCompare(L[b].name||"","ru"));
  else if(s==="I_asc")arr.sort((a,b)=>I(a)-I(b));
  else if(s==="audits_desc")arr.sort((a,b)=>((L[b].audits||[]).length)-((L[a].audits||[]).length));
  else if(s==="created_desc")arr.sort((a,b)=>new Date(L[b].created||0)-new Date(L[a].created||0));
  else arr.sort((a,b)=>I(b)-I(a));
  return arr;
}

document.addEventListener("keydown",e=>{

  const tag=(document.activeElement&&document.activeElement.tagName)||"";

  const map={"1":"dash","2":"check","3":"evid","4":"anal","5":"wgt","6":"pass","7":"port","8":"flow","9":"ref","0":"rep","p":"pres","P":"pres","з":"pres","З":"pres","r":"resp","R":"resp","к":"resp","К":"resp","b":"db","B":"db","и":"db","И":"db","m":"prop","M":"prop","ь":"prop","Ь":"prop","v":"viz","V":"viz","м":"viz","М":"viz"};
  if(map[e.key])goTab(map[e.key]);
  else if((e.key==="ArrowRight"||e.key==="ArrowLeft")&&document.querySelector("section.tab.on")&&document.querySelector("section.tab.on").id==="tab-pres"){e.preventDefault();presNav(e.key==="ArrowRight"?1:-1);}
  else if(e.key==="t"||e.key==="T")toggleTheme();
  else if(e.key==="g"||e.key==="G")startTour();
  else if(e.key==="?"||e.key=="/")helpModal();
});
